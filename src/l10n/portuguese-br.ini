; === Help page ===
help-back           = voltar ao oTranscribe
help-title          = Ajuda do oTranscribe
help-q1             = O oTranscribe oferece transcrição automática?
help-a1             = Não. O oTranscribe é uma ferramenta para facilitar a transcrição manual. Ele não transcreve áudio para você.
help-q2             = Algo está quebrado! Como conserto?
help-a2             = Tente limpar o cache do seu navegador e recarregar a página. Certifique-se também de que está usando uma versão atualizada de um navegador moderno como Chrome, Firefox ou Safari.
help-q3             = Como posso obter suporte ou reportar um bug?
help-a3.innerHTML    = Por favor envie um email para <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Onde minha transcrição é armazenada? É segura?
help-a4             = Sua transcrição é armazenada localmente no seu navegador web. Ela nunca sai do seu computador.
help-q5             = Perdi minha transcrição!
help-a5a            = O oTranscribe não é responsável por transcrições perdidas. No entanto, o oTranscribe agora possui vários métodos de backup:
help-a5b.innerHTML   = <strong>Salvamento automático:</strong> Sua transcrição é salva no armazenamento local do navegador a cada segundo.
help-a5c.innerHTML   = <strong>Download:</strong> Você deve periodicamente baixar sua transcrição como arquivo de texto simples, markdown ou RTF.
help-a5d            = Como último recurso, você pode conseguir recuperar sua transcrição usando o armazenamento local do navegador:
help-a5e            = No Chrome, abra o DevTools (F12), vá para a aba Application e verifique o Armazenamento Local para os dados da sua transcrição.
help-a5f            = No Firefox, abra o DevTools (F12), vá para a aba Storage e olhe embaixo de Armazenamento Local.
help-a5g            = No Safari, habilite o menu Develop nas Preferências, depois vá para Develop > Show Web Inspector e verifique o Armazenamento Local.
help-a5h            = Você também pode verificar o painel Histórico da transcrição no oTranscribe (clique no ícone do relógio) para backups automáticos.
help-q6             = Por que o oTranscribe não está mais salvando backups? / Por que minha exportação não funciona?
help-a6a            = O armazenamento do seu navegador pode estar cheio. Tente limpar o cache do navegador e atualizar a página.
help-a6b            = Alternativamente, você pode tentar o botão Limpar cache no painel de Configurações para liberar espaço.
help-q7             = Posso personalizar os atalhos de teclado?
help-a7 = Sim. Abra o painel de Configurações e encontre a seção Atalhos de teclado. Pressione Ouvir ao lado de um atalho para gravar uma nova combinação de teclas. Você também pode redefinir todos os atalhos para os padrões.
help-q8             = Quais formatos de áudio são suportados?
help-a8             = A maioria dos navegadores modernos suporta os formatos de áudio MP3, WAV, OGG e AAC. Para vídeo, MP4 e WebM são suportados. Você também pode carregar vídeos do YouTube e Vimeo por URL.
help-q9             = O que fazem as marcações de tempo?
help-a9             = As marcações de tempo são links interativos que pulam para o ponto correspondente no áudio. Você pode inseri-las usando o botão acima do editor de texto ou pressionando o atalho (padrão: Alt+T). Clique em uma marcação de tempo na sua transcrição para pular para aquele ponto no áudio.
help-q10            = O oTranscribe funciona offline?
help-a10            = Sim, uma vez que o app é carregado ele funciona offline. No entanto, você precisa carregar o arquivo de áudio do seu computador (URLs do YouTube/Vimeo requerem conexão com a internet).
help-q11            = Por que meu vídeo do YouTube é tão lento?
help-a11            = Os vídeos do YouTube são transmitidos através de um proxy. Você pode alterar a qualidade do vídeo nas configurações do player para melhorar o desempenho.
help-q12            = Posso importar ou exportar transcrições?
help-a12            = Sim. Você pode exportar sua transcrição como texto simples, markdown ou RTF usando o botão de exportação na barra superior. Você também pode importar arquivos de texto simples.
help-q15             = Como posso digitar foneticamente ou usar um teclado virtual?
help-a15.innerHTML   = Você pode usar a extensão Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Ela fornece um teclado virtual e digitação fonética para muitos idiomas, permitindo que você digite diretamente em seu próprio alfabeto no oTranscribe.

