; === Help page ===
help-back           = tilbake til oTranscribe
help-title          = oTranscribe Hjelp
help-q1             = Tilbyr oTranscribe automatisk transkripsjon?
help-a1             = Nei. oTranscribe er et verktøy som gjør manuell transkribering enklere. Det transkriberer ikke lyd automatisk for deg.
help-q2             = Noe er ødelagt! Hvordan fikser jeg det?
help-a2             = Prøv å tømme nettleserens hurtiglager og laste inn siden på nytt. Sørg også for at du bruker en oppdatert versjon av en moderne nettleser som Chrome, Firefox eller Safari.
help-q3             = Hvordan kan jeg få support eller rapportere en feil?
help-a3.innerHTML    = Vennligst send en e-post til <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Hvor lagres transkripsjonen min? Er den sikker?
help-a4             = Transkripsjonen din lagres lokalt i nettleseren. Den forlater aldri datamaskinen din.
help-q5             = Jeg mistet transkripsjonen min!
help-a5a            = oTranscribe er ikke ansvarlig for tapte transkripsjoner. Men oTranscribe har nå flere sikkerhetskopimetoder:
help-a5b.innerHTML   = <strong>Automatisk lagring:</strong> Transkripsjonen din sikkerhetskopieres til nettleserens lokale lagring hvert sekund.
help-a5c.innerHTML   = <strong>Nedlasting:</strong> Du bør regelmessig laste ned transkripsjonen din som en ren tekst-, Markdown- eller RTF-fil.
help-a5d            = Som siste utvei kan du kanskje gjenopprette transkripsjonen din ved hjelp av nettleserens lokale lagring:
help-a5e            = I Chrome, åpne DevTools (F12), gå til Application-fanen, og sjekk Local Storage for transkripsjonsdataene dine.
help-a5f            = I Firefox, åpne DevTools (F12), gå til Storage-fanen, og se under Local Storage.
help-a5g            = I Safari, aktiver Develop-menyen i Innstillinger, gå deretter til Develop > Show Web Inspector og sjekk Local Storage.
help-a5h            = Du kan også sjekke Transkripsjonshistorikk-panelet i oTranscribe (klikk på klokkeikonet) for automatiske sikkerhetskopier.
help-q6             = Hvorfor lagrer ikke oTranscribe lenger sikkerhetskopier? / Hvorfor fungerer ikke eksporten min?
help-a6a            = Nettleserens lagring kan være full. Prøv å tømme hurtiglageret og oppdatere siden.
help-a6b            = Alternativt kan du bruke knappen „Tøm hurtiglager" i Innstillinger for å frigjøre lagringsplass.
help-q7             = Kan jeg tilpasse tastatursnarveier?
help-a7             = Ja. Åpne Innstillinger og finn delen Tastatursnarveier. Trykk på „Registrer" ved siden av en snarvei for å registrere en ny tastekombinasjon. Du kan også tilbakestille alle snarveier til standardinnstillingene.
help-q8             = Hvilke lydformater støttes?
help-a8             = De fleste moderne nettlesere støtter lydformatene MP3, WAV, OGG og AAC. For video støttes MP4 og WebM. Du kan også laste inn YouTube- og Vimeo-videoer via URL.
help-q9             = Hva gjør tidskodene?
help-a9             = Tidsstempler er interaktive lenker som hopper til tilsvarende punkt i lyden. Du kan sette dem inn med knappen over tekstredigereren eller tastatursnarveien (standard: Alt+T). Klikk på et tidsstempel i transkripsjonen din for å hoppe til det punktet i lyden.
help-q10            = Fungerer oTranscribe offline?
help-a10            = Ja, når appen er lastet inn fungerer den offline. Du må imidlertid laste inn lydfilen fra datamaskinen din (YouTube/Vimeo-URL-er krever internettforbindelse).
help-q11            = Hvorfor er YouTube-videoen min så treg?
help-a11            = YouTube-videoer strømmes gjennom en mellomtjener. Du kan endre videokvaliteten i avspillerinnstillingene for å forbedre ytelsen.
help-q12            = Kan jeg importere eller eksportere transkripsjoner?
help-a12            = Ja. Du kan eksportere transkripsjonen din som ren tekst, Markdown eller RTF ved hjelp av eksportknappen i topplinjen. Du kan også importere tekstfiler.
help-q15             = Hvordan kan jeg skrive fonetisk eller bruke et virtuelt tastatur?
help-a15.innerHTML   = Du kan bruke Chrome-utvidelsen <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Den gir et virtuelt tastatur og fonetisk skriving for mange språk, slik at du kan skrive i ditt eget skrift direkte i oTranscribe.

