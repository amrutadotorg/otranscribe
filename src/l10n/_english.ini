help-back           = back to oTranscribe
help-title          = oTranscribe Help
help-q1             = Does oTranscribe offer auto-transcription?
help-a1             = No. oTranscribe is a tool to make manual transcription easier. It doesn't transcribe audio for you.
help-q2             = Something is broken! How do I fix it?
help-a2             = Try clearing your browser's cache and reloading the page. Also make sure you are using an up-to-date version of a modern browser like Chrome, Firefox, or Safari.
help-q3             = How can I get support or report a bug?
help-a3.innerHTML    = Please email <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Where is my transcript stored? Is it secure?
help-a4             = Your transcript is stored locally in your web browser. It never leaves your computer.
help-q5             = I lost my transcript!
help-a5a            = oTranscribe is not responsible for lost transcripts. However, oTranscribe now has multiple backup methods:
help-a5b.innerHTML   = <strong>Autosave:</strong> Your transcript is backed up to your browser's local storage every second.
help-a5c.innerHTML   = <strong>Download:</strong> You should periodically download your transcript as a plain text, markdown, or rich text file.
help-a5d            = As a last resort, you may be able to recover your transcript using your browser's local storage:
help-a5e            = In Chrome, open DevTools (F12), go to the Application tab, and check Local Storage for your transcript data.
help-a5f            = In Firefox, open DevTools (F12), go to the Storage tab, and look under Local Storage.
help-a5g            = In Safari, enable the Develop menu in Preferences, then go to Develop > Show Web Inspector and check Local Storage.
help-a5h            = You can also check the "Transcript history" panel in oTranscribe (click the clock icon) for automatic backups.
help-q6             = Why is oTranscribe no longer saving backups? / Why isn't my export working?
help-a6a            = Your browser's storage may be full. Try clearing your browser cache and refreshing the page.
help-a6b            = Alternatively, you can try the "Clear cache" button in the Settings panel to free up storage space.
help-q7             = Can I customize the keyboard shortcuts?
help-a7             = Yes. Open the Settings panel and find the Keyboard Shortcuts section. Press "Listen" next to a shortcut to record a new key combination. You can also reset all shortcuts to their defaults.
help-q8             = What audio formats are supported?
help-a8             = Most modern browsers support MP3, WAV, OGG, and AAC audio formats. For video, MP4 and WebM are supported. You can also load YouTube and Vimeo videos by URL.
help-q9             = What do the timestamps do?
help-a9             = Timestamps are interactive links that jump to the corresponding point in the audio. You can insert them using the button above the text editor, or by pressing the shortcut key (default: Alt+T). Click a timestamp in your transcript to jump to that point in the audio.
help-q10            = Does oTranscribe work offline?
help-a10            = Yes, once the app is loaded it works offline. However, you need to load the audio file from your computer (YouTube/Vimeo URLs require an internet connection).
help-q11            = Why is my YouTube video so slow?
help-a11            = YouTube videos are streamed through a proxy. You can change the video quality in the player settings to improve performance.
help-q12            = Can I import or export transcripts?
help-a12            = Yes. You can export your transcript as plain text, markdown, or rich text using the export button in the top bar. You can also import plain text files.
help-q15             = How can I type phonetically or use a virtual keyboard?
help-a15.innerHTML   = You can use the <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> Chrome extension. It provides a virtual keyboard and phonetic typing for many languages, allowing you to type in your script directly in oTranscribe.

