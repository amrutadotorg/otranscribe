; === Help page ===
help-back           = tilbage til oTranscribe
help-title          = oTranscribe Hjælp
help-q1             = Tilbyder oTranscribe automatisk transskribering?
help-a1             = Nej. oTranscribe er et værktøj, der gør manuel transskribering lettere. Det transskriberer ikke lyd automatisk for dig.
help-q2             = Noget er i stykker! Hvordan fikser jeg det?
help-a2             = Prøv at rydde din browsercache og genindlæse siden. Sørg også for at du bruger en opdateret version af en moderne browser som Chrome, Firefox eller Safari.
help-q3             = Hvordan kan jeg få support eller rapportere en fejl?
help-a3.innerHTML    = Send venligst en e-mail til <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Hvor gemmes min transskription? Er den sikker?
help-a4             = Din transskription gemmes lokalt i din webbrowser. Den forlader aldrig din computer.
help-q5             = Jeg mistede min transskription!
help-a5a            = oTranscribe er ikke ansvarlig for mistede transskriptioner. Men oTranscribe har nu flere backup-metoder:
help-a5b.innerHTML   = <strong>Automatisk gem:</strong> Din transskription gemmes i din browsers lokale lager hvert sekund.
help-a5c.innerHTML   = <strong>Download:</strong> Du bør regelmæssigt downloade din transskription som en ren tekst-, Markdown- eller RTF-fil.
help-a5d            = Som en sidste udvej kan du muligvis gendanne din transskription ved hjælp af din browsers lokale lager:
help-a5e            = I Chrome, åbn DevTools (F12), gå til Application-fanen, og tjek Local Storage for din transskriptionsdata.
help-a5f            = I Firefox, åbn DevTools (F12), gå til Storage-fanen, og kig under Local Storage.
help-a5g            = I Safari, aktiver Develop-menuen i Indstillinger, gå derefter til Develop > Show Web Inspector og tjek Local Storage.
help-a5h            = Du kan også tjekke Transkriptions-historikpanelet i oTranscribe (klik på uret) for automatiske backups.
help-q6             = Hvorfor gemmer oTranscribe ikke længere sikkerhedskopier? / Hvorfor fungerer min eksport ikke?
help-a6a            = Dit browserlager kan være fuldt. Prøv at rydde din browsercache og genindlæse siden.
help-a6b            = Alternativt kan du bruge knappen „Ryd cache" i Indstillinger for at frigøre lagerplads.
help-q7             = Kan jeg tilpasse tastaturgenveje?
help-a7             = Ja. Åbn Indstillinger og find afsnittet Tastaturgenveje. Tryk på „Lyt" ved siden af en genvej for at optage en ny tastekombination. Du kan også nulstille alle genveje til standardindstillingerne.
help-q8             = Hvilke lydformater understøttes?
help-a8             = De fleste moderne browsere understøtter lydformaterne MP3, WAV, OGG og AAC. Til video understøttes MP4 og WebM. Du kan også indlæse YouTube- og Vimeo-videoer via URL.
help-q9             = Hvad gør tidsstemplerne?
help-a9             = Tidsstempler er interaktive links, der hopper til det tilsvarende punkt i lyden. Du kan indsætte dem med knappen over teksteditoren eller med tastaturgenvejen (standard: Alt+T). Klik på et tidsstempel i din transskription for at hoppe til det punkt i lyden.
help-q10            = Virker oTranscribe offline?
help-a10            = Ja, når appen er indlæst fungerer den offline. Du skal dog indlæse lydfilen fra din computer (YouTube/Vimeo-URL'er kræver internetforbindelse).
help-q11            = Hvorfor er min YouTube-video så langsom?
help-a11            = YouTube-videoer streames gennem en proxy. Du kan ændre videokvaliteten i afspillerindstillingerne for at forbedre ydeevnen.
help-q12            = Kan jeg importere eller eksportere transskriptioner?
help-a12            = Ja. Du kan eksportere din transskription som ren tekst, Markdown eller RTF ved hjælp af eksportknappen i topbjælken. Du kan også importere tekstfiler.
help-q15             = Hvordan kan jeg skrive fonetisk eller bruge et virtuelt tastatur?
help-a15.innerHTML   = Du kan bruge Chrome-udvidelsen <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Den giver et virtuelt tastatur og fonetisk skrivning for mange sprog, så du kan skrive i dit eget script direkte i oTranscribe.

