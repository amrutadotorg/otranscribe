; === Help page ===
help-back           = 返回 oTranscribe
help-title          = oTranscribe 帮助
help-q1             = oTranscribe 提供自动转录吗？
help-a1             = 不。oTranscribe 是一个简化手动转录的工具。它不会为您自动转录音频。
help-q2             = 某些功能出错了！我该如何修复？
help-a2             = 尝试清除浏览器缓存并重新加载页面。同时确保您使用的是最新版本的现代浏览器，如 Chrome、Firefox 或 Safari。
help-q3             = 如何获取支持或报告错误？
help-a3.innerHTML    = 请发送邮件至 <a href="mailto:help@amruta.org">help@amruta.org</a>。
help-q4             = 我的稿件存储在哪里？是否安全？
help-a4             = 您的稿件存储在本地浏览器中，不会离开您的电脑。
help-q5             = 我的稿件丢失了！
help-a5a            = oTranscribe 不对丢失的稿件负责。但是，oTranscribe 现在有多种备份方式：
help-a5b.innerHTML   = <strong>自动保存：</strong>您的稿件每秒自动备份到浏览器本地存储。
help-a5c.innerHTML   = <strong>下载：</strong>您应该定期将转录文本下载为纯文本、Markdown 或 RTF 文件。
help-a5d            = 作为最后手段，您可以尝试使用浏览器本地存储恢复稿件：
help-a5e            = 在 Chrome 中，打开 DevTools（F12），转到"应用"选项卡，检查本地存储中的稿件数据。
help-a5f            = 在 Firefox 中，打开 DevTools（F12），转到"存储"选项卡，在本地存储下查找。
help-a5g            = 在 Safari 中，在偏好设置中启用"开发"菜单，然后转到"开发 > 显示 Web 检查器"并检查本地存储。
help-a5h            = 您还可以在 oTranscribe 的"稿件历史"面板（点击时钟图标）中查看自动备份。
help-q6             = 为什么 oTranscribe 不再保存备份？/ 为什么导出不工作？
help-a6a            = 您的浏览器存储可能已满。尝试清除浏览器缓存并刷新页面。
help-a6b            = 或者，您可以尝试设置面板中的"清除缓存"按钮来释放存储空间。
help-q7             = 我可以自定义键盘快捷键吗？
help-a7             = 可以。打开设置面板并找到“键盘快捷键”部分。点击快捷键旁边的“监听”按钮来录制新的按键组合。您也可以将所有快捷键恢复为默认设置。
help-q8             = 支持哪些音频格式？
help-a8             = 大多数现代浏览器支持 MP3、WAV、OGG 和 AAC 音频格式。视频支持 MP4 和 WebM。您还可以通过 URL 加载 YouTube 和 Vimeo 视频。
help-q9             = 时间戳有什么用？
help-a9             = 时间戳是交互式链接，可以跳转到音频中对应的位置。您可以使用文本编辑器上方的按钮插入时间戳，或按快捷键（默认：Alt+T）。点击稿件中的时间戳即可跳转到音频中的该位置。
help-q10            = oTranscribe 可以离线工作吗？
help-a10            = 可以，应用加载后即可离线工作。但您需要从电脑加载音频文件（YouTube/Vimeo URL 需要互联网连接）。
help-q11            = 为什么我的 YouTube 视频很慢？
help-a11            = YouTube 视频通过代理流式传输。您可以在播放器设置中更改视频质量以提高性能。
help-q12            = 我可以导入或导出稿件吗？
help-a12            = 可以。您可以使用顶部工具栏中的导出按钮，将转录文本导出为纯文本、Markdown 或 RTF。您也可以导入文本文件。
help-q15             = 如何使用语音输入或虚拟键盘？
help-a15.innerHTML   = 您可以使用 <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google 输入工具</a> Chrome 扩展。它提供虚拟键盘和多种语言的语音输入，让您可以直接在 oTranscribe 中使用您的文字输入。

