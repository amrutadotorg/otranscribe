; === Help page ===
help-back           = oTranscribeに戻る
help-title          = oTranscribe ヘルプ
help-q1             = oTranscribeは自動文字起こしを提供していますか？
help-a1             = いいえ。oTranscribe は手動の文字起こしを簡単にするためのツールです。音声を自動で文字起こしすることはできません。
help-q2             = 何かが壊れています！どうすれば直りますか？
help-a2             = ブラウザのキャッシュをクリアしてページを再読み込みしてください。また、Chrome、Firefox、Safariなど最新のブラウザを使用していることを確認してください。
help-q3             = サポートを受けたり、バグを報告するにはどうすればよいですか？
help-a3.innerHTML    = <a href="mailto:help@amruta.org">help@amruta.org</a>にメールをお送りください。
help-q4             = 文字起こしはどこに保存されますか？安全ですか？
help-a4             = 文字起こしはWebブラウザにローカルに保存されます。コンピュータから外に出ることはありません。
help-q5             = 文字起こしデータが消えてしまいました！
help-a5a            = oTranscribeは失われた文字起こしについて責任を負いません。しかし、oTranscribeには複数のバックアップ方法があります：
help-a5b.innerHTML   = <strong>自動保存：</strong> 文字起こしは毎秒ブラウザのローカルストレージにバックアップされます。
help-a5c.innerHTML   = <strong>ダウンロード：</strong> 文字起こしは定期的にプレーンテキスト、Markdown、または RTF ファイルとして保存してください。
help-a5d            = 最後の手段として、ブラウザのローカルストレージを使用して文字起こしを復元できる場合があります：
help-a5e            = Chromeでは、DevTools（F12）を開き、Applicationタブに移動し、Local Storageで文字起こしデータを確認してください。
help-a5f            = Firefoxでは、DevTools（F12）を開き、Storageタブに移動し、Local Storageの下を確認してください。
help-a5g            = Safariでは、環境設定でDevelopメニューを有効にし、Develop > Show Web Inspectorに移動してLocal Storageを確認してください。
help-a5h            = oTranscribeの文字起こし履歴パネル（時計アイコンをクリック）で自動バックアップも確認できます。
help-q6             = なぜoTranscribeがバックアップを保存しなくなりましたか？/ なぜエクスポートが機能しませんか？
help-a6a            = ブラウザのストレージが満杯かもしれません。ブラウザのキャッシュをクリアしてページをリフレッシュしてください。
help-a6b            = または、設定パネルの「キャッシュをクリア」ボタンを使用してストレージ容量を解放できます。
help-q7             = キーボードショートカットをカスタマイズできますか？
help-a7             = はい。設定パネルを開き、「キーボードショートカット」セクションを見つけてください。ショートカットの横にある「聞く」を押すと、新しいキーの組み合わせを登録できます。すべてのショートカットをデフォルトに戻すこともできます。
help-q8             = サポートされている音声形式は？
help-a8             = ほとんどのモダンブラウザはMP3、WAV、OGG、AACの音声形式をサポートしています。動画はMP4とWebMがサポートされています。YouTubeやVimeoの動画もURLで読み込めます。
help-q9             = タイムスタンプとは何ですか？
help-a9             = タイムスタンプは、音声内の対応する位置へ移動するインタラクティブなリンクです。テキストエディタ上部のボタン、またはショートカットキー（デフォルト：Alt+T）で挿入できます。文字起こし内のタイムスタンプをクリックすると、その位置の音声へ移動します。
help-q10            = oTranscribeはオフラインで動作しますか？
help-a10            = はい、アプリが読み込まれるとオフラインで動作します。ただし、コンピュータから音声ファイルを読み込む必要があります（YouTube/VimeoのURLにはインターネット接続が必要です）。
help-q11            = なぜYouTubeの動画がこんなに遅いのですか？
help-a11            = YouTubeの動画はプロキシを通じてストリーミングされます。プレーヤー設定で動画の品質を変更してパフォーマンスを改善できます。
help-q12            = 文字起こしをインポートまたはエクスポートできますか？
help-a12            = はい。上部バーのエクスポートボタンを使用して、プレーンテキスト、Markdown、またはRTFとして文字起こしをエクスポートできます。プレーンテキストファイルもインポートできます。
help-q15             = フォネティックに入力するには、または仮想キーボードを使用するにはどうすればよいですか？
help-a15.innerHTML   = <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google 入力ツール</a> Chrome拡張機能をご利用いただけます。これは多くの言語に対して仮想キーボードとフォネティック入力を提供し、お使いの言語の文字（表記体系）をoTranscribeに直接入力できるようにします。

