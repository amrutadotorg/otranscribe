help-back           = 返回 oTranscribe
help-title          = oTranscribe 說明
help-q1             = oTranscribe 提供自動轉錄嗎？
help-a1             = 否。oTranscribe 是一個簡化手動逐字稿轉錄的工具。它不會為您自動轉錄音訊。
help-q2             = 某些功能壞掉了！該如何修復？
help-a2             = 試著清除瀏覽器快取並重新載入頁面。同時確保您使用的是最新版本的現代瀏覽器，如 Chrome、Firefox 或 Safari。
help-q3             = 如何取得支援或回報錯誤？
help-a3.innerHTML    = 請寄信至 <a href="mailto:help@amruta.org">help@amruta.org</a>。
help-q4             = 我的逐字稿儲存在哪裡？是否安全？
help-a4             = 您的逐字稿儲存在本機瀏覽器中，不會離開您的電腦。
help-q5             = 我的逐字稿不見了！
help-a5a            = oTranscribe 對遺失的逐字稿不負責任。但 oTranscribe 現在有多種備份方式：
help-a5b.innerHTML   = <strong>自動儲存：</strong>您的逐字稿每秒自動備份到瀏覽器本機儲存空間。
help-a5c.innerHTML   = <strong>下載：</strong>您應定期將逐字稿下載為純文字、Markdown 或 RTF 檔案。
help-a5d            = 作為最後手段，您可以嘗試使用瀏覽器本機儲存空間恢復逐字稿：
help-a5e            = 在 Chrome 中，開啟 DevTools（F12），前往「應用程式」分頁，並在本機儲存空間中檢查逐字稿資料。
help-a5f            = 在 Firefox 中，開啟 DevTools（F12），前往「儲存空間」分頁，在本機儲存空間下查找。
help-a5g            = 在 Safari 中，在偏好設定中啟用「開發」選單，然後前往「開發 > 顯示 Web 檢查器」並檢查本機儲存空間。
help-a5h            = 您也可以在 oTranscribe 的「逐字稿歷史」面板（點擊時鐘圖示）中查看自動備份。
help-q6             = 為什麼 oTranscribe 不再儲存備份？/ 為什麼匯出不運作？
help-a6a            = 您的瀏覽器儲存空間可能已滿。嘗試清除瀏覽器快取並重新整理頁面。
help-a6b            = 或者，您可以嘗試設定面板中的「清除快取」按鈕來釋放儲存空間。
help-q7             = 我可以自訂鍵盤快捷鍵嗎？
help-a7             = 可以。開啟設定面板並找到「鍵盤快捷鍵」區段。按下快捷鍵旁的「聆聽」以錄製新的按鍵組合。您也可以將所有快捷鍵恢復為預設值。
help-q8             = 支援哪些音訊格式？
help-a8             = 大多數現代瀏覽器支援 MP3、WAV、OGG 和 AAC 音訊格式。影片支援 MP4 和 WebM。您還可以透過 URL 載入 YouTube 和 Vimeo 影片。
help-q9             = 時間戳記有什麼用？
help-a9             = 時間戳記是互動式連結，可以跳轉到音訊中對應的位置。您可以使用文字編輯器上方的按鈕插入時間戳記，或按快捷鍵（預設：Alt+T）。點擊逐字稿中的時間戳記即可跳轉到音訊中的該位置。
help-q10            = oTranscribe 可以離線工作嗎？
help-a10            = 可以，應用載入後即可離線工作。但您需要從電腦載入音訊檔案（YouTube/Vimeo URL 需要網路連線）。
help-q11            = 為什麼我的 YouTube 影片很慢？
help-a11            = YouTube 影片透過代理串流傳輸。您可以在播放器設定中更改影片品質以提高效能。
help-q12            = 我可以匯入或匯出逐字稿嗎？
help-a12            = 可以。您可以使用頂部工具列的匯出按鈕，將逐字稿匯出為純文字、Markdown 或 RTF。您也可以匯入文字檔案。
help-q15             = 如何使用語音輸入或虛擬鍵盤？
help-a15.innerHTML   = 您可以使用 <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google 輸入工具</a> Chrome 擴充功能。它提供虛擬鍵盤和多種語言的語音輸入，讓您可以直接在 oTranscribe 中使用您的文字輸入。

