; === Help page ===
help-back           = torna a Transcribe
help-title          = Ajuda de Transcribe
help-q1 = Ofereix Transcribe transcripció automàtica?
help-a1             = No. Transcribe és una eina per facilitar la transcripció manual. No transcriu àudio per vostè.
help-q2 = Alguna cosa no funciona! Com ho arreglo?
help-a2             = Proveu de netejar la memòria cau del vostre navegador i tornar a carregar la pàgina. Assegureu-vos també que esteu utilitzant una versió actualitzada d'un navegador modern com Chrome, Firefox o Safari.
help-q3 = Com puc obtenir suport o informar d'un error?
help-a3.innerHTML    = Envieu un correu electrònic a <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4 = On s'emmagatzema la meva transcripció? És segura?
help-a4             = La vostra transcripció s'emmagatzema localment al vostre navegador web. Mai abandona el vostre ordinador.
help-q5 = He perdut la meva transcripció!
help-a5a            = Transcribe no es fa responsable de les transcripcions perdudes. Tanmateix, Transcribe ara disposa de diversos mètodes de còpia de seguretat:
help-a5b.innerHTML = <strong>Desament automàtic:</strong> La vostra transcripció es fa còpia de seguretat a l'emmagatzematge local del navegador cada segon.
help-a5c.innerHTML = <strong>Baixada:</strong> Hauríeu de baixar periòdicament la vostra transcripció com a fitxer de text pla, markdown o text enriquit.
help-a5d            = Com a darrer recurs, potser podeu recuperar la vostra transcripció utilitzant l'emmagatzematge local del navegador:
help-a5e            = Al Chrome, obriu DevTools (F12), aneu a la pestanya Aplicacions i comproveu l'emmagatzematge local per obtenir les dades de la transcripció.
help-a5f            = Al Firefox, obriu DevTools (F12), aneu a la pestanya Emmagatzematge i busqueu a l'emmagatzematge local.
help-a5g            = Al Safari, activeu el menú Develop a Preferències, després aneu a Develop > Show Web Inspector i comproveu l'emmagatzematge local.
help-a5h            = També podeu comprovar el panell Historial de transcripcions a Transcribe (feu clic a la icona del rellotge) per obtenir còpies de seguretat automàtiques.
help-q6 = Per què Transcribe ja no desa còpies de seguretat? / Per què l'exportació no funciona?
help-a6a            = L'emmagatzematge del vostre navegador pot estar ple. Proveu de netejar la memòria cau del navegador i actualitzar la pàgina.
help-a6b            = Alternativament, podeu provar el botó Neteja la memòria cau al panell de Configuració per alliberar espai d'emmagatzematge.
help-q7 = Puc personalitzar les dreceres de teclat?
help-a7             = Sí. Obriu el panell de Configuració i trobeu la secció Dreceres de teclat. Premeu Escolta al costat d'una drecera per gravar una nova combinació de tecles. També podeu restablir totes les dreceres als valors predeterminats.
help-q8 = Quins formats d'àudio són compatibles?
help-a8             = La majoria de navegadors moderns admeten els formats d'àudio MP3, WAV, OGG i AAC. Per a vídeo, s'admeten MP4 i WebM. També podeu carregar vídeos de YouTube i Vimeo per URL.
help-q9 = Què fan les marques de temps?
help-a9             = Les marques de temps són enllaços interactius que salten al punt corresponent de l'àudio. Podeu inserir-les utilitzant el botó de sobre l'editor de text o prement la tecla de drecera (per defecte: Alt+T). Feu clic a una marca de temps a la vostra transcripció per saltar a aquest punt de l'àudio.
help-q10 = Funciona Transcribe sense connexió?
help-a10            = Sí, un cop carregada l'aplicació funciona sense connexió. Tanmateix, heu de carregar el fitxer d'àudio des del vostre ordinador ( els URL de YouTube/Vimeo requereixen connexió a Internet).
help-q11 = Per què el meu vídeo de YouTube és tan lent?
help-a11            = Els vídeos de YouTube es retransmeten a través d'un servidor intermediari. Podeu canviar la qualitat del vídeo a la configuració del reproductor per millorar el rendiment.
help-q12 = Puc importar o exportar transcripcions?
help-a12            = Sí. Podeu exportar la vostra transcripció com a text pla, markdown o text enriquit utilitzant el botó d'exportació a la barra superior. També podeu importar fitxers de text pla.
help-q15             = Com puc escriure fonèticament o utilitzar un teclat virtual?
help-a15.innerHTML   = Transcribe té <b>entrada fonètica integrada</b>. Ves a <b>Configuració</b> i activa l'<b>entrada fonètica (transliteració)</b>, després tria el teu idioma. Escriu en lletres llatines i prem Espai — l'última paraula serà reemplaçada automàticament pel teu alfabet (p. ex. devanagari, àrab, ciríl·lic).<br /><br />Com a alternativa, pots utilitzar l'extensió de Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> per a un teclat virtual o opcions fonètiques addicionals.

