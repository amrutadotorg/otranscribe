; === Help page ===
help-back           = torna a oTranscribe
help-title          = Aiuto oTranscribe
help-q1             = oTranscribe offre trascrizione automatica?
help-a1             = No. oTranscribe è uno strumento che facilita la trascrizione manuale. Non trascrive automaticamente l'audio al posto tuo.
help-q2             = Qualcosa è rotto! Come lo riparo?
help-a2             = Prova a cancellare la cache del browser e ricaricare la pagina. Assicurati anche di usare una versione aggiornata di un browser moderno come Chrome, Firefox o Safari.
help-q3             = Come posso ottenere supporto o segnalare un bug?
help-a3.innerHTML    = Invia una email a <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Dove è memorizzata la mia trascrizione? È sicura?
help-a4             = La tua trascrizione è memorizzata localmente nel tuo browser web. Non lascia mai il tuo computer.
help-q5             = Ho perso la mia trascrizione!
help-a5a            = oTranscribe non è responsabile delle trascrizioni perse. Tuttavia, oTranscribe ora ha più metodi di backup:
help-a5b.innerHTML   = <strong>Salvataggio automatico:</strong> La tua trascrizione viene salvata nella memoria locale del browser ogni secondo.
help-a5c.innerHTML   = <strong>Download:</strong> Dovresti scaricare periodicamente la tua trascrizione come file di testo semplice, Markdown o RTF.
help-a5d            = Come ultima risorsa, potresti essere in grado di recuperare la tua trascrizione usando la memoria locale del browser:
help-a5e            = In Chrome, apri DevTools (F12), vai alla scheda Application e controlla la Memoria locale per i dati della tua trascrizione.
help-a5f            = In Firefox, apri DevTools (F12), vai alla scheda Storage e guarda sotto Memoria locale.
help-a5g            = In Safari, abilita il menu Develop nelle Preferenze, poi vai a Develop > Show Web Inspector e controlla la Memoria locale.
help-a5h            = Puoi anche controllare il pannello Cronologia della trascrizione in oTranscribe (clicca sull'icona dell'orologio) per i backup automatici.
help-q6             = Perché oTranscribe non salva più backup? / Perché la mia esportazione non funziona?
help-a6a            = La memoria del tuo browser potrebbe essere piena. Prova a cancellare la cache del browser e ricaricare la pagina.
help-a6b            = In alternativa, puoi usare il pulsante "Cancella cache" nel pannello Impostazioni per liberare spazio di archiviazione.
help-q7             = Posso personalizzare le scorciatoie da tastiera?
help-a7             = Sì. Apri il pannello Impostazioni e trova la sezione Scorciatoie da tastiera. Premi "Ascolta" accanto a una scorciatoia per registrare una nuova combinazione di tasti. Puoi anche ripristinare tutte le scorciatoie ai valori predefiniti.
help-q8             = Quali formati audio sono supportati?
help-a8             = La maggior parte dei browser moderni supporta i formati audio MP3, WAV, OGG e AAC. Per i video, sono supportati MP4 e WebM. Puoi anche caricare video YouTube e Vimeo tramite URL.
help-q9             = Che cosa fanno i timestamp?
help-a9             = I timestamp sono collegamenti interattivi che portano al punto corrispondente nell'audio. Puoi inserirli usando il pulsante sopra l'editor di testo oppure premendo il tasto di scelta rapida (predefinito: Alt+T). Clicca su un timestamp nella tua trascrizione per andare a quel punto dell'audio.
help-q10            = oTranscribe funziona offline?
help-a10            = Sì, una volta caricata l'app funziona offline. Tuttavia, devi caricare il file audio dal tuo computer (gli URL YouTube/Vimeo richiedono una connessione Internet).
help-q11            = Perché il mio video YouTube è così lento?
help-a11            = I video YouTube vengono trasmessi tramite un proxy. Puoi cambiare la qualità del video nelle impostazioni del lettore per migliorare le prestazioni.
help-q12            = Posso importare o esportare trascrizioni?
help-a12            = Sì. Puoi esportare la tua trascrizione come testo semplice, Markdown o RTF usando il pulsante di esportazione nella barra superiore. Puoi anche importare file di testo.
help-q15             = Come posso digitare foneticamente o usare una tastiera virtuale?
help-a15.innerHTML   = Puoi utilizzare l'estensione Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Fornisce una tastiera virtuale e digitazione fonetica per molte lingue, permettendoti di scrivere direttamente nei tuoi caratteri nativi su oTranscribe.

