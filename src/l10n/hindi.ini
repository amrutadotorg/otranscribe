; === Help page ===
help-back           = oTranscribe पर वापस जाएं
help-title          = oTranscribe सहायता
help-q1             = क्या oTranscribe स्वचालित ट्रांसक्रिप्शन प्रदान करता है?
help-a1             = नहीं। oTranscribe मैन्युअल ट्रांसक्रिप्शन को आसान बनाने वाला एक उपकरण है। यह आपके लिए ऑडियो का ट्रांसक्रिप्शन नहीं करता।
help-q2             = कुछ टूट गया है! मैं इसे कैसे ठीक करूं?
help-a2             = अपने ब्राउज़र का कैश साफ़ करने और पेज को फिर से लोड करने का प्रयास करें। साथ ही सुनिश्चित करें कि आप Chrome, Firefox या Safari जैसे आधुनिक ब्राउज़र के अद्यतन संस्करण का उपयोग कर रहे हैं।
help-q3             = मुझे सहायता कैसे मिल सकती है या बग की रिपोर्ट कैसे करूं?
help-a3.innerHTML    = कृपया <a href="mailto:help@amruta.org">help@amruta.org</a> पर ईमेल करें।
help-q4             = मेरा ट्रांसक्रिप्ट कहां संग्रहीत है? क्या यह सुरक्षित है?
help-a4             = आपका ट्रांसक्रिप्ट आपके वेब ब्राउज़र में स्थानीय रूप से संग्रहीत है। यह कभी आपके कंप्यूटर से बाहर नहीं जाता।
help-q5             = मैंने अपना ट्रांसक्रिप्ट खो दिया!
help-a5a            = oTranscribe खोए हुए ट्रांसक्रिप्ट के लिए जिम्मेदार नहीं है। हालांकि, oTranscribe के पास अब कई बैकअप विधियां हैं:
help-a5b.innerHTML   = <strong>स्वचालित सहेजना:</strong> आपका ट्रांसक्रिप्ट हर सेकंड आपके ब्राउज़र के स्थानीय स्टोरेज में बैकअप लिया जाता है।
help-a5c.innerHTML   = <strong>डाउनलोड:</strong> आपको समय-समय पर अपना ट्रांसक्रिप्ट प्लेन टेक्स्ट, Markdown या RTF फ़ाइल के रूप में डाउनलोड करना चाहिए।
help-a5d            = अंतिम उपाय के रूप में, आप अपने ब्राउज़र के स्थानीय स्टोरेज का उपयोग करके अपना ट्रांसक्रिप्ट पुनर्प्राप्त कर सकते हैं:
help-a5e            = Chrome में, DevTools (F12) खोलें, Application टैब पर जाएं, और अपने ट्रांसक्रिप्ट डेटा के लिए Local Storage जांचें।
help-a5f            = Firefox में, DevTools (F12) खोलें, Storage टैब पर जाएं, और Local Storage के नीचे देखें।
help-a5g            = Safari में, Preferences में Develop मेनू सक्षम करें, फिर Develop > Show Web Inspector पर जाएं और Local Storage जांचें।
help-a5h            = आप oTranscribe में ट्रांसक्रिप्ट इतिहास पैनल (घड़ी आइकन पर क्लिक करें) भी देख सकते हैं स्वचालित बैकअप के लिए।
help-q6             = अब oTranscribe बैकअप क्यों नहीं सहेजता? / मेरा एक्सपोर्ट क्यों काम नहीं कर रहा?
help-a6a            = आपके ब्राउज़र का स्टोरेज भरा हो सकता है। अपने ब्राउज़र का कैश साफ़ करने और पेज को रिफ्रेश करने का प्रयास करें।
help-a6b            = आप स्टोरेज स्थान खाली करने के लिए सेटिंग्स पैनल में „Clear cache" बटन का उपयोग भी कर सकते हैं।
help-q7             = क्या मैं कीबोर्ड शॉर्टकट कस्टमाइज़ कर सकता हूं?
help-a7             = हाँ। सेटिंग्स पैनल खोलें और कीबोर्ड शॉर्टकट अनुभाग खोजें। नया कुंजी संयोजन रिकॉर्ड करने के लिए किसी शॉर्टकट के पास „Listen" दबाएँ। आप सभी शॉर्टकट को डिफ़ॉल्ट पर भी रीसेट कर सकते हैं।
help-q8             = कौन से ऑडियो प्रारूप समर्थित हैं?
help-a8             = अधिकांश आधुनिक ब्राउज़र MP3, WAV, OGG और AAC ऑडियो प्रारूपों का समर्थन करते हैं। वीडियो के लिए, MP4 और WebM समर्थित हैं। आप YouTube और Vimeo वीडियो भी URL से लोड कर सकते हैं।
help-q9             = टाइमस्टैम्प क्या करते हैं?
help-a9             = टाइमस्टैम्प इंटरैक्टिव लिंक होते हैं जो ऑडियो के संबंधित स्थान पर ले जाते हैं। आप इन्हें टेक्स्ट एडिटर के ऊपर दिए गए बटन या शॉर्टकट कुंजी (डिफ़ॉल्ट: Alt+T) से जोड़ सकते हैं। ट्रांसक्रिप्ट में टाइमस्टैम्प पर क्लिक करके ऑडियो के उस स्थान पर जाएँ।
help-q10            = क्या oTranscribe ऑफ़लाइन काम करता है?
help-a10            = हां, एक बार ऐप लोड हो जाने पर यह ऑफ़लाइन काम करता है। हालांकि, आपको अपने कंप्यूटर से ऑडियो फ़ाइल लोड करनी होगी (YouTube/Vimeo URLs के लिए इंटरनेट कनेक्शन आवश्यक है)।
help-q11            = मेरा YouTube वीडियो इतना धीमा क्यों है?
help-a11            = YouTube वीडियो प्रॉक्सी के माध्यम से स्ट्रीम होते हैं। आप प्रदर्शन सुधारने के लिए प्लेयर सेटिंग्स में वीडियो क्वालिटी बदल सकते हैं।
help-q12            = क्या मैं ट्रांसक्रिप्ट इम्पोर्ट या एक्सपोर्ट कर सकता हूं?
help-a12            = हाँ। आप शीर्ष बार में एक्सपोर्ट बटन का उपयोग करके अपने ट्रांसक्रिप्ट को प्लेन टेक्स्ट, Markdown या RTF के रूप में निर्यात कर सकते हैं। आप टेक्स्ट फ़ाइलें भी इम्पोर्ट कर सकते हैं।
help-q15             = मैं ध्वन्यात्मक रूप से कैसे टाइप कर सकता हूं या वर्चुअल कीबोर्ड का उपयोग कैसे कर सकता हूं?
help-a15.innerHTML   = आप <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> Chrome एक्सटेंशन का उपयोग कर सकते हैं। यह कई भाषाओं के लिए वर्चुअल कीबोर्ड और ध्वन्यात्मक टाइपिंग प्रदान करता है, जिससे आप सीधे oTranscribe में अपनी लिपि में टाइप कर सकते हैं।

