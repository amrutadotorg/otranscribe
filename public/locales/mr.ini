; === Help page ===
help-back           = oTranscribe वर परत जा
help-title          = oTranscribe मदत
help-q1             = oTranscribe स्वयं-लिप्यंतरण प्रदान करते का?
help-a1             = नाही. oTranscribe हे मॅन्युअल ट्रान्सक्रिप्शन सोपे करण्यासाठी एक साधन आहे. ते तुमच्यासाठी ऑडिओचे ट्रान्सक्रिप्शन करत नाही.
help-q2             = काहीतरी तुटले आहे! मी ते कसे दुरुस्त करू?
help-a2             = तुमच्या ब्राउझरचा कॅश साफ करून पृष्ठ पुन्हा लोड करून पहा. तुम्ही Chrome, Firefox किंवा Safari सारख्या आधुनिक ब्राउझरचा अद्ययावत आवृत्ती वापरत आहात याची खात्री करा.
help-q3             = मला समर्थन कसे मिळू शकते किंवा बग कसे नोंदवावे?
help-a3.innerHTML    = कृपया <a href="mailto:help@amruta.org">help@amruta.org</a> वर ईमेल करा.
help-q4             = माझा ट्रान्सक्रिप्ट कुठे साठवला जातो? ते सुरक्षित आहे का?
help-a4             = तुमचा ट्रान्सक्रिप्ट तुमच्या वेब ब्राउझरमध्ये स्थानिकरित्या साठवला जातो. तो कधीही तुमच्या संगणकातून बाहेर पडत नाही.
help-q5             = माझा ट्रान्सक्रिप्ट हरवला!
help-a5a            = oTranscribe हरवलेल्या ट्रान्सक्रिप्टसाठी जबाबदार नाही. मात्र, oTranscribe कडे आता अनेक बॅकअप पद्धती आहेत:
help-a5b.innerHTML   = <strong>स्वयं-जतन:</strong> तुमचा ट्रान्सक्रिप्ट दर सेकंदाला तुमच्या ब्राउझरच्या स्थानिक स्टोरेजमध्ये बॅकअप केला जातो.
help-a5c.innerHTML   = <strong>डाउनलोड:</strong> तुम्ही तुमचे ट्रान्सक्रिप्ट नियमितपणे प्लेन टेक्स्ट, Markdown किंवा RTF फाइल म्हणून डाउनलोड करावे.
help-a5d            = अंतिम उपाय म्हणून, तुम्ही तुमच्या ब्राउझरच्या स्थानिक स्टोरेजचा वापर करून तुमचा ट्रान्सक्रिप्ट पुनर्प्राप्त करू शकता:
help-a5e            = Chrome मध्ये, DevTools उघडा (F12), Application टॅबवर जा, आणि तुमचा ट्रान्सक्रिप्ट डेटा तपासण्यासाठी Local Storage तपासा.
help-a5f            = Firefox मध्ये, DevTools उघडा (F12), Storage टॅबवर जा, आणि Local Storage खाली पहा.
help-a5g            = Safari मध्ये, Preferences मध्ये Develop मेनू सक्षम करा, मग Develop > Show Web Inspector वर जा आणि Local Storage तपासा.
help-a5h            = तुम्ही oTranscribe मधील "ट्रान्सक्रिप्ट इतिहास" पॅनेलही (घड्याळ आइकन वर क्लिक करा) आपोआप बॅकअपसाठी तपासू शकता.
help-q6             = oTranscribe आता बॅकअप का जतन करत नाही? / माझा एक्सपोर्ट का काम करत नाही?
help-a6a            = तुमचा ब्राउझर स्टोरेज भरला असू शकतो. तुमच्या ब्राउझरचा कॅश साफ करून पृष्ठ रिफ्रेश करून पहा.
help-a6b            = तुम्ही स्टोरेज जागा मोकळी करण्यासाठी सेटिंग्स पॅनेलमधील „कॅश साफ करा" बटण वापरू शकता.
help-q7             = मी कीबोर्ड शॉर्टकट्स सानुकूलित करू शकतो का?
help-a7             = हो. सेटिंग्स पॅनेल उघडा आणि कीबोर्ड शॉर्टकट्स विभाग शोधा. नवीन की कॉम्बिनेशन नोंदवण्यासाठी शॉर्टकटजवळ „Listen" दाबा. तुम्ही सर्व शॉर्टकट्स त्यांच्या डीफॉल्टस पुनर्स्थापित करू शकता.
help-q8             = कोणत्या ऑडिओ फॉरमॅट्स समर्थित आहेत?
help-a8             = बहुतेक आधुनिक ब्राउझर MP3, WAV, OGG आणि AAC ऑडिओ फॉरमॅट्स समर्थन देतात. व्हिडिओसाठी, MP4 आणि WebM समर्थित आहेत. तुम्ही YouTube आणि Vimeo व्हिडिओ URL वरूनही लोड करू शकता.
help-q9             = टाइमस्टँप काय करतात?
help-a9             = टाइमस्टँप हे परस्परसंवादी दुवे आहेत जे ऑडिओमधील संबंधित ठिकाणी घेऊन जातात. तुम्ही ते टेक्स्ट एडिटरवरील बटणाद्वारे किंवा शॉर्टकट की (डीफॉल्ट: Alt+T) वापरून जोडू शकता. ट्रान्सक्रिप्टमधील टाइमस्टँपवर क्लिक करून ऑडिओमधील त्या ठिकाणी जा.
help-q10            = oTranscribe ऑफलाइन काम करते का?
help-a10            = हो, अॅप लोड झाल्यावर ते ऑफलाइन काम करते. मात्र, तुम्हाला तुमच्या संगणकावरून ऑडिओ फाइल लोड करावी लागेल (YouTube/Vimeo URLs ला इंटरनेट कनेक्शन आवश्यक आहे).
help-q11            = माझा YouTube व्हिडिओ इतका हळू का आहे?
help-a11            = YouTube व्हिडिओ प्रॉक्सीमधून स्ट्रीम केल्या जातात. तुम्ही प्लेयर सेटिंग्जमध्ये व्हिडिओ गुणवत्ता बदलून कार्यक्षमता सुधारू शकता.
help-q12            = मी ट्रान्सक्रिप्ट इम्पोर्ट किंवा एक्सपोर्ट करू शकतो का?
help-a12            = हो. तुम्ही शीर्ष पट्टीवरील एक्सपोर्ट बटणाचा वापर करून तुमचा ट्रान्सक्रिप्ट प्लेन टेक्स्ट, Markdown किंवा RTF म्हणून एक्सपोर्ट करू शकता. तुम्ही टेक्स्ट फाइलीही इम्पोर्ट करू शकता.
help-q15             = मी ध्वन्यात्मकरित्या कसे टाइप करू शकतो किंवा व्हर्च्युअल कीबोर्ड कसे वापरू शकतो?
help-a15.innerHTML   = oTranscribe मध्ये <b>अंतर्निहित ध्वन्यात्मक इनपुट</b> आहे. <b>सेटिंग्स</b> वर जा आणि <b>ध्वन्यात्मक इनपुट (लिप्यंतरण)</b> सक्षम करा, मग तुमची भाषा निवडा. लॅटिन अक्षरांमध्ये टाइप करा आणि स्पेस दाबा — शेवटचा शब्द आपोआप तुमच्या लिपीने (उदा. देवनागरी, अरबी, सिरिलिक) बदलला जाईल.<br /><br />पर्याय म्हणून, तुम्ही व्हर्च्युअल कीबोर्ड किंवा अतिरिक्त ध्वन्यात्मक पर्यायांसाठी <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> Chrome विस्तार वापरू शकता.

