help-back           = επιστροφή στο oTranscribe
help-title          = Βοήθεια oTranscribe
help-q1             = Το oTranscribe προσφέρει αυτόματη απομαγνητοφώνηση;
help-a1             = Όχι. Το oTranscribe είναι ένα εργαλείο που διευκολύνει τη χειροκίνητη απομαγνητοφώνηση. Δεν μεταγράφει αυτόματα τον ήχο για εσάς.
help-q2             = Κάτι είναι χαλασμένο! Πώς το διορθώνω;
help-a2             = Δοκιμάστε να καθαρίσετε την προσωρινή μνήμη (cache) του φυλλομετρητή σας και να ανανεώσετε τη σελίδα. Βεβαιωθείτε επίσης ότι χρησιμοποιείτε μια ενημερωμένη έκδοση ενός σύγχρονου φυλλομετρητή όπως Chrome, Firefox ή Safari.
help-q3             = Πώς μπορώ να λάβω υποστήριξη ή να αναφέρω σφάλμα;
help-a3.innerHTML    = Παρακαλώ στείλτε email στο <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Πού αποθηκεύεται η απομαγνητοφώνησή μου; Είναι ασφαλής;
help-a4             = Η απομαγνητοφώνησή σας αποθηκεύεται τοπικά στο πρόγραμμα περιήγησής σας. Δεν εγκαταλείπει ποτέ τον υπολογιστή σας.
help-q5             = Χάσα την απομαγνητοφώνησή μου!
help-a5a            = Το oTranscribe δεν ευθύνεται για χαμένες απομαγνητοφωνήσεις. Ωστόσο, το oTranscribe διαθέτει πλέον πολλαπλές μεθόδους αντιγράφων ασφαλείας:
help-a5b.innerHTML   = <strong>Αυτόματη αποθήκευση:</strong> Η απομαγνητοφώνησή σας αντιγράφεται κάθε δευτερόλεπτο στην τοπική μνήμη του φυλλομετρητή σας.
help-a5c.innerHTML   = <strong>Λήψη:</strong> Θα πρέπει να κατεβάζετε τακτικά την απομαγνητοφώνησή σας ως απλό κείμενο, Markdown ή αρχείο RTF.
help-a5d            = Ως τελευταία λύση, μπορείτε να ανακτήσετε την απομαγνητοφώνησή σας χρησιμοποιώντας την τοπική μνήμη του φυλλομετρητή σας:
help-a5e            = Στο Chrome, ανοίξτε τα DevTools (F12), πηγαίνετε στην καρτέλα Application και ελέγξτε την τοπική μνήμη για τα δεδομένα απομαγνητοφώνησής σας.
help-a5f            = Στο Firefox, ανοίξτε τα DevTools (F12), πηγαίνετε στην καρτέλα Storage και κοιτάξτε κάτω από την τοπική μνήμη.
help-a5g            = Στο Safari, ενεργοποιήστε το μενού Develop στις Προτιμήσεις, στη συνέχεια πηγαίνετε στο Develop > Show Web Inspector και ελέγξτε την τοπική μνήμη.
help-a5h            = Μπορείτε επίσης να ελέγξτε τον πίνακα Ιστορικό απομαγνητοφωνήσεων στο oTranscribe (κάντε κλικ στο εικονίδιο ρολογιού) για αυτόματα αντίγραφα ασφαλείας.
help-q6             = Γιατί το oTranscribe δεν αποθηκεύει πλέον αντίγραφα ασφαλείας; / Γιατί η εξαγωγή μου δεν λειτουργεί;
help-a6a            = Ο χώρος αποθήκευσης του φυλλομετρητή σας μπορεί να είναι γεμάτος. Δοκιμάστε να καθαρίσετε την προσωρινή μνήμη (cache) και να ανανεώσετε τη σελίδα.
help-a6b            = Εναλλακτικά, μπορείτε να χρησιμοποιήσετε το κουμπί «Εκκαθάριση cache» στις Ρυθμίσεις για να ελευθερώσετε χώρο αποθήκευσης.
help-q7             = Μπορώ να προσαρμόσω τις συντομεύσεις πληκτρολογίου;
help-a7             = Ναι. Ανοίξτε τις Ρυθμίσεις και βρείτε την ενότητα «Συντομεύσεις πληκτρολογίου». Πατήστε «Καταγραφή» δίπλα σε μια συντόμευση για να καταγράψετε νέο συνδυασμό πλήκτρων. Μπορείτε επίσης να επαναφέρετε όλες τις συντομεύσεις στις προεπιλογές.
help-q8             = Ποιες μορφές ήχου υποστηρίζονται;
help-a8             = Οι περισσότεροι σύγχρονοι περιηγητές υποστηρίζουν μορφές ήχου MP3, WAV, OGG και AAC. Για βίντεο υποστηρίζονται MP4 και WebM. Μπορείτε επίσης να φορτώσετε βίντεο YouTube και Vimeo μέσω URL.
help-q9             = Τι κάνουν οι χρονικές επισημάνσεις;
help-a9             = Οι χρονικές σημάνσεις είναι διαδραστικοί σύνδεσμοι που μεταβαίνουν στο αντίστοιχο σημείο του ήχου. Μπορείτε να τις εισαγάγετε με το κουμπί πάνω από τον επεξεργαστή κειμένου ή με τη συντόμευση (προεπιλογή: Alt+T). Κάντε κλικ σε μια χρονική σήμανση στην απομαγνητοφώνησή σας για μετάβαση σε εκείνο το σημείο.
help-q10            = Το oTranscribe λειτουργεί εκτός σύνδεσης;
help-a10            = Ναι, μετά τη φόρτωση της εφαρμογής λειτουργεί εκτός σύνδεσης. Ωστόσο, πρέπει να φορτώσετε το αρχείο ήχου από τον υπολογιστή σας (τα URL YouTube/Vimeo απαιτούν σύνδεση στο διαδίκτυο).
help-q11            = Γιατί το βίντεο YouTube μου είναι τόσο αργό;
help-a11            = Τα βίντεο YouTube μεταδίδονται μέσω proxy. Μπορείτε να αλλάξετε την ποιότητα βίντεο στις ρυθμίσεις αναπαραγωγέα για βελτίωση της απόδοσης.
help-q12            = Μπορώ να εισάγω ή εξάγω απομαγνητοφωνήσεις;
help-a12            = Ναι. Μπορείτε να εξαγάγετε την απομαγνητοφώνησή σας ως απλό κείμενο, Markdown ή RTF χρησιμοποιώντας το κουμπί εξαγωγής στην επάνω γραμμή. Μπορείτε επίσης να εισάγετε αρχεία κειμένου.
help-q15             = Πώς μπορώ να πληκτρολογήσω φωνητικά ή να χρησιμοποιήσω εικονικό πληκτρολόγιο;
help-a15.innerHTML   = Το oTranscribe διαθέτει <b>ενσωματωμένη φωνητική εισαγωγή χαρακτήρων</b>. Πηγαίνετε στις <b>Ρυθμίσεις</b> και ενεργοποιήστε τη <b>Φωνητική εισαγωγή (μεταγραφή)</b>, στη συνέχεια επιλέξτε τη γλώσσα σας. Πληκτρολογήστε με λατινικά γράμματα και πατήστε το Διάστημα — η τελευταία λέξη θα αντικατασταθεί αυτόματα με το σύστημα γραφής σας (π.χ. ντεβαναγκαρί, αραβικά, κυριλλικά).<br /><br />Εναλλακτικά, μπορείτε να χρησιμοποιήσετε την επέκταση Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> για εικονικό πληκτρολόγιο ή πρόσθετες επιλογές φωνητικής εισαγωγής.

