; === Help page ===
help-back           = înapoi la oTranscribe
help-title          = Ajutor oTranscribe
help-q1             = Oferă oTranscribe transcriere automată?
help-a1             = Nu. oTranscribe este un instrument care facilitează transcrierea manuală. Nu transcrie automat fișierele audio pentru dvs.
help-q2             = Ceva este stricat! Cum repar?
help-a2             = Încercați să ștergeți cache-ul browserului și să reîncărcați pagina. Asigurați-vă de asemenea că utilizați o versiune actualizată a unui browser modern precum Chrome, Firefox sau Safari.
help-q3             = Cum pot obține suport sau raporta o eroare?
help-a3.innerHTML   = Vă rugăm trimiteți un email la <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Unde este stocată transcrierea mea? Este sigură?
help-a4             = Transcrierea dvs. este stocată local în browserul web. Nu părăsește niciodată computerul dvs.
help-q5             = Am pierdut transcrierea mea!
help-a5a            = oTranscribe nu este responsabil pentru transcrierile pierdute. Totuși, oTranscribe are acum mai multe metode de backup:
help-a5b.innerHTML   = <strong>Salvare automată:</strong> Transcrierea dvs. este copiată în stocarea locală a browserului la fiecare secundă.
help-a5c.innerHTML   = <strong>Descărcare:</strong> Ar trebui să descărcați periodic transcrierea ca fișier text simplu, Markdown sau RTF.
help-a5d            = Ca ultimă soluție, puteți încerca să recuperați transcrierea folosind stocarea locală a browserului:
help-a5e            = În Chrome, deschideți DevTools (F12), mergeți la tabul Application și verificați Stocarea Locală pentru datele transcrierii.
help-a5f            = În Firefox, deschideți DevTools (F12), mergeți la tabul Storage și căutați sub Stocarea Locală.
help-a5g            = În Safari, activați meniul Develop din Preferințe, apoi mergeți la Develop > Show Web Inspector și verificați Stocarea Locală.
help-a5h            = De asemenea, puteți verifica panoul Istoric Transcrieri din oTranscribe (faceți clic pe pictograma de ceas) pentru backup-uri automate.
help-q6             = De ce nu mai salvează oTranscribe backup-uri? / De ce exportul meu nu funcționează?
help-a6a            = Stocarea browserului dvs. poate fi plină. Încercați să ștergeți cache-ul și să reîmprospătați pagina.
help-a6b            = Alternativ, puteți folosi butonul „Șterge cache" din panoul Setări pentru a elibera spațiu de stocare.
help-q7             = Pot personaliza scurtăturile de tastatură?
help-a7             = Da. Deschideți panoul Setări și găsiți secțiunea Scurtături de tastatură. Apăsați „Înregistrare" lângă o scurtătură pentru a înregistra o combinație nouă de taste. Puteți reveni și la setările implicite.
help-q8             = Ce formate audio sunt acceptate?
help-a8             = Majoritatea browserelor moderne acceptă formatele audio MP3, WAV, OGG și AAC. Pentru video sunt acceptate MP4 și WebM. Puteți încărca și videoclipuri YouTube și Vimeo prin URL.
help-q9             = Ce fac marcajele de timp?
help-a9             = Marcajele de timp sunt linkuri interactive care duc la punctul corespunzător din audio. Le puteți insera folosind butonul de deasupra editorului de text sau combinația de taste (implicit: Alt+T). Faceți clic pe un marcaj de timp din transcriere pentru a ajunge la acel punct din audio.
help-q10            = oTranscribe funcționează offline?
help-a10            = Da, după încărcarea aplicației aceasta funcționează offline. Totuși, trebuie să încărcați fișierul audio de pe calculator (URL-urile YouTube/Vimeo necesită conexiune la internet).
help-q11            = De ce videoclipul meu YouTube este așa de lent?
help-a11            = Videoclipurile YouTube sunt transmise printr-un proxy. Puteți schimba calitatea videoclipului în setările playerului pentru a îmbunătăți performanța.
help-q12            = Pot importa sau exporta transcrieri?
help-a12            = Da. Puteți exporta transcrierea ca text simplu, Markdown sau RTF folosind butonul de export din bara de sus. Puteți importa și fișiere text.
help-q15             = Cum pot tasta fonetic sau utiliza o tastatură virtuală?
help-a15.innerHTML   = oTranscribe are <b>tastare fonetică integrată</b>. Accesați <b>Setări</b> și activați <b>tastarea fonetică (transliterare)</b>, apoi alegeți limba dvs. Tastați cu litere latine și apăsați tasta Spațiu — ultimul cuvânt va fi înlocuit automat cu alfabetul dvs. (de ex. devanagari, arabă, chirilic).<br /><br />Alternativ, puteți utiliza extensia Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> pentru o tastatură virtuală sau opțiuni fonetice suplimentare.

