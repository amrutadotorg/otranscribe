; === Help page ===
help-back           = العودة إلى oTranscribe
help-title          = مساعدة oTranscribe
help-q1             = هل يوفر oTranscribe تفريغًا نصيًا تلقائيًا؟
help-a1             = لا. oTranscribe أداة لتسهيل التفريغ النصي اليدوي. لا يقوم بتفريغ الصوت تلقائيًا نيابةً عنك.
help-q2             = شيء ما معطّل! كيف أصلحه؟
help-a2             = جرّب مسح ذاكرة التخزين المؤقت للمتصفح وإعادة تحميل الصفحة. تأكد أيضًا من استخدام إصدار حديث من متصفح حديث مثل Chrome أو Firefox أو Safari.
help-q3             = كيف يمكنني الحصول على الدعم أو الإبلاغ عن خطأ؟
help-a3.innerHTML    = يرجى مراسلة <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = أين يُخزَّن التفريغ النصي؟ هل هو آمن؟
help-a4             = يُخزَّن التفريغ النصي محليًا في متصفح الويب الخاص بك. لا يغادر جهازك أبدًا.
help-q5             = لقد فقدت التفريغ النصي!
help-a5a            = oTranscribe غير مسؤول عن النصوص المفقودة. ومع ذلك، يمتلك oTranscribe الآن عدة طرق للنسخ الاحتياطي:
help-a5b.innerHTML   = <strong>الحفظ التلقائي:</strong> يتم الحفظ الاحتياطي للتفريغ النصي في التخزين المحلي للمتصفح كل ثانية.
help-a5c.innerHTML   = <strong>التنزيل:</strong> يجب تنزيل التفريغ النصي بشكل دوري كملف نص عادي أو Markdown أو RTF.
help-a5d            = كملاذ أخير، يمكنك استعادة التفريغ النصي باستخدام التخزين المحلي للمتصفح:
help-a5e            = في Chrome، افتح DevTools (F12)، وانتقل إلى تطبيقات، وتحقق من التخزين المحلي لبيانات نصّك.
help-a5f            = في Firefox، افتح DevTools (F12)، وانتقل إلى التخزين، وتحقق من التخزين المحلي.
help-a5g            = في Safari، فعّل قائمة Develop في التفضيلات، ثم انتقل إلى Develop > Show Web Inspector وتحقق من التخزين المحلي.
help-a5h            = يمكنك أيضًا التحقق من لوحة سجل التفريغ النصي في oTranscribe (انقر على أيقونة الساعة) للنسخ الاحتياطي التلقائي.
help-q6             = لماذا لم يعد oTranscribe يحفظ النسخ الاحتياطية؟ / لماذا لا يعمل التصدير؟
help-a6a            = قد تكون ذاكرة تخزين المتصفح ممتلئة. جرّب مسح ذاكرة التخزين المؤقت للمتصفح وتحديث الصفحة.
help-a6b            = بدلاً من ذلك، يمكنك استخدام زر "مسح ذاكرة التخزين المؤقت" في لوحة الإعدادات لتحرير مساحة التخزين.
help-q7             = هل يمكنني تخصيص اختصارات لوحة المفاتيح؟
help-a7             = نعم. افتح لوحة الإعدادات وابحث عن قسم اختصارات لوحة المفاتيح. اضغط على "استماع" بجانب الاختصار لتسجيل مجموعة مفاتيح جديدة. يمكنك أيضًا إعادة جميع الاختصارات إلى الإعدادات الافتراضية.
help-q8             = ما هي صيغ الصوت المدعومة？
help-a8             = تدعم معظم المتصفحات الحديثة صيغ الصوت MP3 وWAV وOGG وAAC. للفيديو، يتم دعم MP4 وWebM. يمكنك أيضًا تحميل مقاطع فيديو YouTube وVimeo عبر الرابط.
help-q9             = ما الذي تفعله الطوابع الزمنية？
help-a9             = الطوابع الزمنية هي روابط تفاعلية تنتقل إلى النقطة المقابلة في الصوت. يمكنك إدراجها باستخدام الزر الموجود فوق محرر النص أو باستخدام اختصار لوحة المفاتيح (الافتراضي: Alt+T). انقر على طابع زمني في التفريغ النصي للانتقال إلى تلك النقطة في الصوت.
help-q10            = هل يعمل oTranscribe بدون إنترنت？
help-a10            = نعم، بمجرد تحميل التطبيق يعمل بدون إنترنت. ومع ذلك، تحتاج إلى تحميل ملف الصوت من جهازك (روابط YouTube/Vimeo تتطلب اتصال بالإنترنت).
help-q11            = لماذا فيديو YouTube بطيء جداً？
help-a11            = يتم بث مقاطع فيديو YouTube عبر وكيل. يمكنك تغيير جودة الفيديو في إعدادات المشغل لتحسين الأداء.
help-q12            = هل يمكنني استيراد أو تصدير النصوص？
help-a12            = نعم. يمكنك تصدير التفريغ النصي كنص عادي أو Markdown أو RTF باستخدام زر التصدير في الشريط العلوي. ويمكنك أيضًا استيراد ملفات نصية.
help-q15             = كيف يمكنني الكتابة بالكتابة الصوتية أو استخدام لوحة مفاتيح افتراضية؟
help-a15.innerHTML   = يمكنك استخدام إضافة <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> لمتصفح Chrome. توفر لوحة مفاتيح افتراضية وكتابة صوتية للعديد من اللغات، مما يسمح لك بالكتابة بخطوطك مباشرة في oTranscribe.

