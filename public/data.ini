help-back           = вернуться к oTranscribe
help-title          = Справка oTranscribe
help-q1             = Предлагает ли oTranscribe автоматическую расшифровку?
help-a1             = Нет. oTranscribe — это инструмент для упрощения ручной расшифровки. Он не выполняет автоматическую расшифровку аудио.
help-q2             = Что-то сломалось! Как это исправить?
help-a2             = Попробуйте очистить кэш браузера и перезагрузить страницу. Также убедитесь, что вы используете последнюю версию современного браузера, такого как Chrome, Firefox или Safari.
help-q3             = Как получить поддержку или сообщить об ошибке?
help-a3.innerHTML    = Пожалуйста, отправьте письмо на <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Где хранится моя расшифровка? Безопасно ли это?
help-a4             = Ваша расшифровка хранится локально в вашем браузере. Она никогда не покидает ваш компьютер.
help-q5             = Я потерял свою расшифровку!
help-a5a            = oTranscribe не несёт ответственности за потерянные расшифровки. Однако oTranscribe теперь имеет несколько методов резервного копирования:
help-a5b.innerHTML   = <strong>Автосохранение:</strong> Ваша расшифровка резервируется в локальном хранилище браузера каждую секунду.
help-a5c.innerHTML   = <strong>Загрузка:</strong> Вам следует регулярно скачивать расшифровку как обычный текстовый файл, Markdown или RTF.
help-a5d            = В качестве крайней меры вы можете восстановить расшифровку из локального хранилища браузера:
help-a5e            = В Chrome откройте DevTools (F12), перейдите на вкладку Application и проверьте Local Storage на наличие данных расшифровки.
help-a5f            = В Firefox откройте DevTools (F12), перейдите на вкладку Storage и посмотрите под Local Storage.
help-a5g            = В Safari включите меню Develop в Настройках, затем перейдите в Develop > Show Web Inspector и проверьте Local Storage.
help-a5h            = Вы также можете проверить панель «История расшифровок» в oTranscribe (нажмите на значок часов) для автоматических резервных копий.
help-q6             = Почему oTranscribe больше не сохраняет резервные копии? / Почему мой экспорт не работает?
help-a6a            = Хранилище вашего браузера может быть заполнено. Попробуйте очистить кэш браузера и обновить страницу.
help-a6b            = Также можно использовать кнопку «Очистить кэш» в панели настроек, чтобы освободить место.
help-q7             = Могу ли я настроить горячие клавиши?
help-a7             = Да. Откройте панель настроек и найдите раздел «Горячие клавиши». Нажмите «Ожидать ввод» рядом с сочетанием клавиш, чтобы записать новую комбинацию. Вы также можете восстановить все горячие клавиши по умолчанию.
help-q8             = Какие аудиоформаты поддерживаются?
help-a8             = Большинство современных браузеров поддерживают аудиоформаты MP3, WAV, OGG и AAC. Для видео поддерживаются MP4 и WebM. Также можно загружать видео YouTube и Vimeo по URL.
help-q9             = Что делают временные метки?
help-a9             = Временные метки — это интерактивные ссылки, которые переходят к соответствующему месту в аудио. Их можно вставить с помощью кнопки над текстовым редактором или сочетания клавиш (по умолчанию: Alt+T). Нажмите на временную метку в расшифровке, чтобы перейти к этому месту в аудио.
help-q10            = Работает ли oTranscribe офлайн?
help-a10            = Да, после загрузки приложения оно работает офлайн. Однако необходимо загрузить аудиофайл с компьютера (URL YouTube/Vimeo требуют подключения к интернету).
help-q11            = Почему мое видео YouTube такое медленное?
help-a11            = Видео YouTube передаются через прокси. Вы можете изменить качество видео в настройках плеера для улучшения производительности.
help-q12            = Могу ли я импортировать или экспортировать расшифровки?
help-a12            = Да. Вы можете экспортировать расшифровку как обычный текст, Markdown или RTF с помощью кнопки экспорта в верхней панели. Также можно импортировать текстовые файлы.
help-q15             = Как я могу печатать фонетически или использовать виртуальную клавиатуру?
help-a15.innerHTML   = Вы можете использовать расширение Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Оно обеспечивает виртуальную клавиатуру и фонетический ввод для многих языков, позволяя печатать на вашем языке непосредственно в oTranscribe.

