help-back           = terug naar oTranscribe
help-title          = oTranscribe Hulp
help-q1             = Biedt oTranscribe automatische transcribering?
help-a1             = Nee. oTranscribe is een hulpmiddel om handmatig transcriberen eenvoudiger te maken. Het transcribeert audio niet automatisch voor je.
help-q2             = Iets is kapot! Hoe repareer ik het?
help-a2             = Probeer je browsercache te wissen en de pagina opnieuw te laden. Zorg er ook voor dat je een bijgewerkte versie van een moderne browser gebruikt zoals Chrome, Firefox of Safari.
help-q3             = Hoe kan ik ondersteuning krijgen of een bug melden?
help-a3.innerHTML    = Stuur een e-mail naar <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Waar wordt mijn transcript opgeslagen? Is het veilig?
help-a4             = Je transcript wordt lokaal opgeslagen in je webbrowser. Het verlaat nooit je computer.
help-q5             = Ik ben mijn transcript kwijt!
help-a5a            = oTranscribe is niet verantwoordelijk voor verloren transcripts. Maar oTranscribe heeft nu meerdere back-upmethoden:
help-a5b.innerHTML   = <strong>Automatisch opslaan:</strong> Je transcript wordt elke seconde opgeslagen in de lokale opslag van je browser.
help-a5c.innerHTML   = <strong>Download:</strong> Je zou je transcript regelmatig moeten downloaden als platte tekst, Markdown of een RTF-bestand.
help-a5d            = Als allerlaatste redmiddel kun je je transcript mogelijk herstellen met je browser lokaal geheugen:
help-a5e            = In Chrome, open DevTools (F12), ga naar het Application tabblad, en check Local Storage voor je transcriptgegevens.
help-a5f            = In Firefox, open DevTools (F12), ga naar het Storage tabblad, en kijk onder Local Storage.
help-a5g            = In Safari, schakel het Develop menu in Voorkeuren in, ga dan naar Develop > Show Web Inspector en check Local Storage.
help-a5h            = Je kunt ook het Transcriptgeschiedenis paneel in oTranscribe checken (klik op het klokje) voor automatische back-ups.
help-q6             = Waarom slaat oTranscribe geen back-ups meer op? / Waarom werkt mijn export niet?
help-a6a            = Je browseropslag is misschien vol. Probeer je browsercache te wissen en de pagina te verversen.
help-a6b            = Je kunt ook de knop „Cache wissen" in het paneel Instellingen gebruiken om opslagruimte vrij te maken.
help-q7             = Kan ik de sneltoetsen aanpassen?
help-a7             = Ja. Open het paneel Instellingen en zoek de sectie Sneltoetsen. Druk op „Luisteren" naast een sneltoets om een nieuwe toetscombinatie op te nemen. Je kunt ook alle sneltoetsen terugzetten naar de standaardinstellingen.
help-q8             = Welke audioformaten worden ondersteund?
help-a8             = De meeste moderne browsers ondersteunen de audioformaten MP3, WAV, OGG en AAC. Voor video worden MP4 en WebM ondersteund. Je kunt ook YouTube- en Vimeo-video's via URL laden.
help-q9             = Wat doen de tijdstempels?
help-a9             = Tijdstempels zijn interactieve links die naar het overeenkomstige punt in de audio springen. Je kunt ze invoegen met de knop boven de teksteditor of via de sneltoets (standaard: Alt+T). Klik op een tijdstempel in je transcript om naar dat punt in de audio te springen.
help-q10            = Werkt oTranscribe offline?
help-a10            = Ja, zodra de app is geladen werkt deze offline. Je moet het audiobestand echter vanaf je computer laden (YouTube/Vimeo-URL's vereisen een internetverbinding).
help-q11            = Waarom is mijn YouTube-video zo langzaam?
help-a11            = YouTube-video's worden gestreamd via een proxy. Je kunt de videokwaliteit wijzigen in de spelersinstellingen om de prestaties te verbeteren.
help-q12            = Kan ik transcripts importeren of exporteren?
help-a12            = Ja. Je kunt je transcript exporteren als platte tekst, Markdown of RTF met de exportknop in de bovenbalk. Je kunt ook tekstbestanden importeren.
help-q15             = Hoe kan ik fonetisch typen of een virtueel toetsenbord gebruiken?
help-a15.innerHTML   = Je kunt de <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> Chrome-extensie gebruiken. Het biedt een virtueel toetsenbord en fonetisch typen voor veel talen, zodat je direct in je eigen schrijfsysteem in oTranscribe kunt typen.

