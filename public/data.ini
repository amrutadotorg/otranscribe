; === Help page ===
help-back           = oTranscribe'a dön
help-title          = oTranscribe Yardım
help-q1             = oTranscribe otomatik transkripsiyon sunuyor mu?
help-a1             = Hayır. oTranscribe, manuel transkripsiyonu kolaylaştıran bir araçtır. Sesleri sizin için otomatik olarak transkripsiyon yapmaz.
help-q2             = Bir şey bozuldu! Nasıl tamir ederim?
help-a2             = Tarayıcınızın önbelleğini temizleyip sayfayı yeniden yüklemeyi deneyin. Ayrıca Chrome, Firefox veya Safari gibi güncel bir tarayıcı kullandığınızdan emin olun.
help-q3             = Nasıl destek alabilirim veya hata bildirebilirim?
help-a3.innerHTML    = Lütfen <a href="mailto:help@amruta.org">help@amruta.org</a> adresine e-posta gönderin.
help-q4             = Transkripsiyonum nerede saklanıyor? Güvenli mi?
help-a4             = Transkripsiyonunuz web tarayıcınızda yerel olarak saklanır. Bilgisayarınızdan asla çıkmaz.
help-q5             = Transkripsiyonumu kaybettim!
help-a5a            = oTranscribe, kayıp transkripsiyonlardan sorumlu değildir. Ancak oTranscribe artık çoklu yedekleme yöntemlerine sahiptir:
help-a5b.innerHTML   = <strong>Otomatik kaydetme:</strong> Transkripsiyonunuz her saniye tarayıcınızın yerel deposuna yedeklenir.
help-a5c.innerHTML   = <strong>İndirme:</strong> Transkripsiyonunuzu düzenli olarak düz metin, Markdown veya RTF dosyası olarak indirmelisiniz.
help-a5d            = Son çare olarak, tarayıcınızın yerel deposunu kullanarak transkripsiyonunuzu kurtarabilirsiniz.
help-a5e            = Chrome'da DevTools'u (F12) açın, Application sekmesine gidin ve Local Storage'da deşifre verilerinizi kontrol edin.
help-a5f            = Firefox'ta DevTools'u (F12) açın, Storage sekmesine gidin ve Local Storage altında bakın.
help-a5g            = Safari'de Tercihler'de Develop menüsünü etkinleştirin, ardından Develop > Show Web Inspector'a gidin ve Local Storage'ı kontrol edin.
help-a5h            = Ayrıca oTranscribe'daki Transkripsiyon geçmişi paneline (saat simgesine tıklayın) otomatik yedekler için bakabilirsiniz.
help-q6             = Neden oTranscribe artık yedeklemiyor? / Neden dışa aktarmam çalışmıyor?
help-a6a            = Tarayıcınızın depolama alanı dolu olabilir. Tarayıcınızın önbelleğini temizleyip sayfayı yenilemeyi deneyin.
help-a6b            = Alternatif olarak, depolama alanını boşaltmak için Ayarlar panelindeki „Önbelleği temizle" düğmesini kullanabilirsiniz.
help-q7             = Klavye kısayollarını özelleştirebilir miyim?
help-a7             = Evet. Ayarlar panelini açın ve Klavye kısayolları bölümünü bulun. Yeni bir tuş kombinasyonu kaydetmek için bir kısayolun yanındaki „Dinle" seçeneğine basın. Tüm kısayolları varsayılan ayarlarına da sıfırlayabilirsiniz.
help-q8             = Hangi ses formatları destekleniyor?
help-a8             = Çoğu modern tarayıcı MP3, WAV, OGG ve AAC ses formatlarını destekler. Video için MP4 ve WebM desteklenir. YouTube ve Vimeo videolarını URL üzerinden de yükleyebilirsiniz.
help-q9             = Zaman damgaları ne işe yarar?
help-a9             = Zaman damgaları, ses kaydındaki ilgili noktaya atlayan etkileşimli bağlantılardır. Bunları metin düzenleyicisinin üzerindeki düğmeyle veya klavye kısayoluyla (varsayılan: Alt+T) ekleyebilirsiniz. Transkripsiyonunuzdaki bir zaman damgasına tıklayarak sesin o noktasına gidebilirsiniz.
help-q10            = oTranscribe çevrimdışı çalışır mı?
help-a10            = Evet, uygulama yüklendikten sonra çevrimdışı çalışır. Ancak ses dosyasını bilgisayarınızdan yüklemeniz gerekir (YouTube/Vimeo URL'leri internet bağlantısı gerektirir).
help-q11            = YouTube videom neden bu kadar yavaş?
help-a11            = YouTube videoları bir proxy üzerinden aktarılır. Performansı iyileştirmek için oynatıcı ayarlarında video kalitesini değiştirebilirsiniz.
help-q12            = Transkripsiyonları içe veya dışa aktarabilir miyim?
help-a12            = Evet. Transkripsiyonunuzu üst çubuktaki dışa aktarma düğmesini kullanarak düz metin, Markdown veya RTF olarak dışa aktarabilirsiniz. Ayrıca metin dosyalarını içe aktarabilirsiniz.
help-q15             = Fonetik olarak nasıl yazabilirim veya sanal klavye nasıl kullanabilirim?
help-a15.innerHTML   = <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> Chrome eklentisini kullanabilirsiniz. Birçok dil için sanal klavye ve fonetik yazma sağlayarak, oTranscribe'da doğrudan kendi yazınızla yazmanıza olanak tanır.

