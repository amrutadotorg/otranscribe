help-back           = bumaling sa oTranscribe
help-title          = Tulong sa oTranscribe
help-q1             = Nag-aalok ba ang oTranscribe ng awtomatikong transkripsyon?
help-a1             = Hindi. Ang oTranscribe ay isang kasangkapan para gawing mas madali ang manu-manong transkripsyon. Hindi nito ini-transcribe ang audio para sa iyo.
help-q2             = May sirang bahagi! Paano ko ito aayusin?
help-a2             = Subukang burahin ang cache ng iyong browser at i-reload ang pahina. Tiyaking gumagamit ka ng updated na bersyon ng modernong browser tulad ng Chrome, Firefox, o Safari.
help-q3             = Paano ako makakakuha ng suporta o mag-report ng bug?
help-a3.innerHTML    = Mangyaring mag-email sa <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Nasaan ang aking transcript? Ligtas ba ito?
help-a4             = Ang iyong transcript ay naiimbak sa lokal sa iyong web browser. Hindi ito kailanman lalabas sa iyong computer.
help-q5             = Nawala ang aking transcript!
help-a5a            = Hindi responsable ang oTranscribe sa mga nawawalang transcript. Gayunpaman, mayroon na ngayong maraming paraan ng backup ang oTranscribe:
help-a5b.innerHTML   = <strong>Awtomatikong pag-save:</strong> Ang iyong transcript ay na-backup sa local storage ng iyong browser bawat segundo.
help-a5c.innerHTML   = <strong>I-download:</strong> Dapat mong panandaliang i-download ang iyong transcript bilang plain text, markdown, o rich text file.
help-a5d            = Bilang huling paraan, maaari mong ma-recover ang iyong transcript gamit ang local storage ng iyong browser:
help-a5e            = Sa Chrome, buksan ang DevTools (F12), pumunta sa Application tab, at tingnan ang Local Storage para sa data ng iyong transcript.
help-a5f            = Sa Firefox, buksan ang DevTools (F12), pumunta sa Storage tab, at tingnan ang ilalim ng Local Storage.
help-a5g            = Sa Safari, i-enable ang Develop menu sa Preferences, pagkatapos pumunta sa Develop > Show Web Inspector at tingnan ang Local Storage.
help-a5h            = Maaari mo ring tingnan ang Transcript history panel sa oTranscribe (i-click ang clock icon) para sa mga awtomatikong backup.
help-q6             = Bakit hindi na nagse-save ng backup ang oTranscribe? / Bakit hindi gumagana ang aking export?
help-a6a            = Maaaring puno na ang storage ng iyong browser. Subukang burahin ang cache ng iyong browser at i-refresh ang pahina.
help-a6b            = Bilang alternatibo, maaari mong subukan ang Clear cache button sa Settings panel upang maglabas ng espasyo.
help-q7             = Maaari ko bang i-customize ang mga keyboard shortcut?
help-a7             = Oo. Buksan ang Settings panel at hanapin ang Keyboard Shortcuts section. Pindutin ang Listening tabi ng shortcut para mag-record ng bagong key combination. Maaari mo ring i-reset ang lahat ng shortcut sa kanilang mga default.
help-q8             = Anong mga audio format ang suportado?
help-a8             = Karamihan sa mga modernong browser ay sumusuporta sa MP3, WAV, OGG, at AAC audio format. Para sa video, suportado ang MP4 at WebM. Maaari ka ring mag-load ng YouTube at Vimeo video sa pamamagitan ng URL.
help-q9             = Ano ang ginagawa ng mga timestamp?
help-a9             = Ang mga timestamp ay mga interactive link na tumalon sa kaukulang punto sa audio. Maaari mo itong ilagay gamit ang button sa itaas ng text editor, o sa pamamagitan ng pagpindot sa shortcut key (default: Alt+T). I-click ang timestamp sa iyong transcript para tumalon sa puntong iyon sa audio.
help-q10            = Gumagana ba ang oTranscribe offline?
help-a10            = Oo, kapag na-load na ang app ay gumagana ito offline. Gayunpaman, kailangan mong i-load ang audio file mula sa iyong computer (ang mga YouTube/Vimeo URL ay nangangailangan ng internet connection).
help-q11            = Bakit napakabagal ng aking YouTube video?
help-a11            = Ang mga YouTube video ay ini-stream sa pamamagitan ng proxy. Maaari mong baguhin ang video quality sa player settings upang mapabuti ang performance.
help-q12            = Maaari ba akong mag-import o mag-export ng transcript?
help-a12            = Oo. Maaari mong i-export ang iyong transcript bilang plain text, markdown, o rich text gamit ang export button sa top bar. Maaari ka ring mag-import ng plain text files.
help-q15             = Paano ako makakapag-type nang fonetik o gumamit ng virtual keyboard?
help-a15.innerHTML   = Maaari mong gamitin ang <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> Chrome extension. Nagbibigay ito ng virtual keyboard at fonetik na pag-type para sa maraming wika, na nagbibigay-daan sa iyo na mag-type sa iyong script nang diretso sa oTranscribe.

