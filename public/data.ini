; === Help page ===
help-back           = tillbaka till oTranscribe
help-title          = oTranscribe Hjälp
help-q1             = Erbjuder oTranscribe automatisk transkribering?
help-a1             = Nej. oTranscribe är ett verktyg som underlättar manuell transkribering. Det transkriberar inte ljud automatiskt åt dig.
help-q2             = Något är trasigt! Hur fixar jag det?
help-a2             = Försök rensa webbläsarens cache och ladda om sidan. Se också till att du använder en uppdaterad version av en modern webbläsare som Chrome, Firefox eller Safari.
help-q3             = Hur kan jag få support eller rapportera en bugg?
help-a3.innerHTML    = Vänligen skicka ett e-postmeddelande till <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Var lagras min transkribering? Är det säkert?
help-a4             = Din transkribering lagras lokalt i din webbläsare. Den lämnar aldrig din dator.
help-q5             = Jag tappade min transkribering!
help-a5a            = oTranscribe ansvarar inte för borttappade transkriberingar. Men oTranscribe har nu flera säkerhetsmetoder:
help-a5b.innerHTML   = <strong>Automatiskt sparande:</strong> Din transkribering säkerhetskoperas till webbläsarens lokala lagring varje sekund.
help-a5c.innerHTML   = <strong>Nedladdning:</strong> Du bör regelbundet ladda ner din transkribering som en vanlig textfil, Markdown eller RTF.
help-a5d            = Som sista utväg kan du återställa din transkribering med webbläsarens lokala lagring:
help-a5e            = I Chrome, öppna DevTools (F12), gå till fliken Application och kolla Local Storage för din transkriberingsdata.
help-a5f            = I Firefox, öppna DevTools (F12), gå till fliken Storage och titta under Local Storage.
help-a5g            = I Safari, aktivera Develop-menyn i Inställningar, gå sedan till Develop > Show Web Inspector och kolla Local Storage.
help-a5h            = Du kan också kolla Transkriberingshistorik-panelen i oTranscribe (klicka på klockikonen) för automatiska säkerhetskopior.
help-q6             = Varför sparar oTranscribe inte längre säkerhetskopior? / Varför fungerar inte min export?
help-a6a            = Din webbläsares lagring kan vara full. Försök rensa cachen och uppdatera sidan.
help-a6b            = Alternativt kan du använda knappen „Rensa cache" i inställningspanelen för att frigöra lagringsutrymme.
help-q7             = Kan jag anpassa tangentbordsgenvägar?
help-a7             = Ja. Öppna inställningspanelen och hitta avsnittet Tangentbordsgenvägar. Tryck på „Spela in" bredvid en genväg för att spela in en ny tangentkombination. Du kan också återställa alla genvägar till standardinställningarna.
help-q8             = Vilka ljudformat stöds?
help-a8             = De flesta moderna webbläsare stöder ljudformaten MP3, WAV, OGG och AAC. För video stöds MP4 och WebM. Du kan också ladda YouTube- och Vimeo-videor via URL.
help-q9             = Vad gör tidsstämplarna?
help-a9             = Tidsstämplar är interaktiva länkar som hoppar till motsvarande punkt i ljudet. Du kan infoga dem med knappen ovanför textredigeraren eller med tangentbordsgenvägen (standard: Alt+T). Klicka på en tidsstämpel i din transkribering för att hoppa till den punkten i ljudet.
help-q10            = Fungerar oTranscribe offline?
help-a10            = Ja, när appen har laddats fungerar den offline. Du måste dock ladda ljudfilen från din dator (YouTube/Vimeo-URL:er kräver internetanslutning).
help-q11            = Varför är min YouTube-video så långsam?
help-a11            = YouTube-videor streamas via en proxy. Du kan ändra videokvaliteten i spelarinställningarna för att förbättra prestanda.
help-q12            = Kan jag importera eller exportera transkriberingar?
help-a12            = Ja. Du kan exportera din transkribering som vanlig text, Markdown eller RTF med exportknappen i det övre fältet. Du kan också importera textfiler.
help-q15             = Hur kan jag skriva fonetiskt eller använda ett virtuellt tangentbord?
help-a15.innerHTML   = Du kan använda Chrome-tillägget <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Det ger ett virtuellt tangentbord och fonetisk skrivning för många språk, så att du kan skriva med ditt eget skriftsystem direkt i oTranscribe.

