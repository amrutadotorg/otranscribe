; === Help page ===
help-back           = wróć do oTranscribe
help-title          = Pomoc oTranscribe
help-q1             = Czy oTranscribe oferuje automatyczną transkrypcję?
help-a1             = Nie. oTranscribe to narzędzie ułatwiające ręczną transkrypcję. Nie transkrybuje audio za Ciebie.
help-q2             = Coś jest zepsute! Jak to naprawić?
help-a2             = Spróbuj wyczyścić pamięć podręczną przeglądarki i odświeżyć stronę. Upewnij się również, że korzystasz z aktualnej wersji nowoczesnej przeglądarki, takiej jak Chrome, Firefox lub Safari.
help-q3             = Jak mogę uzyskać pomoc lub zgłosić błąd?
help-a3.innerHTML    = Napisz na <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Gdzie przechowywany jest mój transkrypt? Czy jest bezpieczny?
help-a4             = Twój transkrypt jest przechowywany lokalnie w przeglądarce. Nigdy nie opuszcza Twojego komputera.
help-q5             = Straciłem swój transkrypt!
help-a5a            = oTranscribe nie odpowiada za utracone transkrypcje. Jednak oTranscribe oferuje wiele metod kopii zapasowych:
help-a5b.innerHTML   = <strong>Automatyczny zapis:</strong> Twój transkrypt jest zapisywany w pamięci lokalnej przeglądarki co sekundę.
help-a5c.innerHTML   = <strong>Pobieranie:</strong> Powinieneś okresowo pobierać transkrypt jako plik tekstowy, markdown lub RTF.
help-a5d            = W ostateczności możesz odzyskać transkrypt z pamięci lokalnej przeglądarki:
help-a5e            = W Chrome otwórz DevTools (F12), przejdź do zakładki Aplikacja i sprawdź pamięć lokalną pod kątem danych transkryptu.
help-a5f            = W Firefox otwórz DevTools (F12), przejdź do zakładki Pamięć i sprawdź pamięć lokalną.
help-a5g            = W Safari włącz menu Programista w Ustawieniach, następnie przejdź do Programista > Pokaż Inspektora Web i sprawdź pamięć lokalną.
help-a5h            = Możesz również sprawdzić panel Historia transkryptów w oTranscribe (kliknij ikonę zegara), aby zobaczyć automatyczne kopie zapasowe.
help-q6             = Dlaczego oTranscribe nie zapisuje już kopii zapasowych? / Dlaczego eksport nie działa?
help-a6a            = Pamięć przeglądarki może być pełna. Spróbuj wyczyścić pamięć podręczną i odświeżyć stronę.
help-a6b            = Możesz również użyć przycisku „Wyczyść pamięć podręczną" w panelu Ustawienia, aby zwolnić miejsce.
help-q7             = Czy mogę dostosować skróty klawiszowe?
help-a7             = Tak. Otwórz panel Ustawienia i znajdź sekcję Skróty klawiszowe. Naciśnij przycisk „Nasłuchuj" obok skrótu, aby nagrać nową kombinację klawiszy. Możesz również przywrócić domyślne skróty.
help-q8             = Jakie formaty audio są obsługiwane?
help-a8             = Większość nowoczesnych przeglądarek obsługuje formaty MP3, WAV, OGG i AAC. W przypadku wideo obsługiwane są MP4 i WebM. Możesz również wczytać filmy z YouTube i Vimeo, podając URL.
help-q9             = Do czego służą znaczniki czasu?
help-a9             = Znaczniki czasu to interaktywne linki, które przenoszą do odpowiedniego momentu w nagraniu. Możesz je wstawić za pomocą przycisku nad edytorem lub skrótem klawiszowym (domyślnie: Alt+T). Kliknij znacznik w transkrypcie, aby przejść do tego momentu w nagraniu.
help-q10            = Czy oTranscribe działa offline?
help-a10            = Tak, po załadowaniu aplikacja działa offline. Musisz jednak załadować plik audio z komputera (adresy URL YouTube/Vimeo wymagają połączenia z internetem).
help-q11            = Dlaczego mój film z YouTube jest wolny?
help-a11            = Filmy z YouTube są przesyłane przez proxy. Możesz zmienić jakość wideo w ustawieniach odtwarzacza, aby poprawić wydajność.
help-q12            = Czy mogę importować lub eksportować transkrypcje?
help-a12            = Tak. Możesz eksportować transkrypt jako zwykły tekst, Markdown lub plik RTF za pomocą przycisku Eksportuj na górnym pasku. Możesz też importować pliki tekstowe.
help-q15             = Jak mogę pisać fonetycznie lub korzystać z wirtualnej klawiatury?
help-a15.innerHTML   = Możesz użyć rozszerzenia Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Zawiera wirtualną klawiaturę i pisanie fonetyczne dla wielu języków, umożliwiając pisanie bezpośrednio w swoim alfabecie w oTranscribe.

