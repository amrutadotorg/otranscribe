help-back           = volver a oTranscribe
help-title          = Ayuda de oTranscribe
help-q1             = ¿oTranscribe ofrece transcripción automática?
help-a1             = No. oTranscribe es una herramienta para facilitar la transcripción manual. No transcribe audio por ti.
help-q2             = ¡Algo no funciona! ¿Cómo lo arreglo?
help-a2             = Intenta borrar la caché de tu navegador y recargar la página. Asegúrate también de usar una versión actualizada de un navegador moderno como Chrome, Firefox o Safari.
help-q3             = ¿Cómo puedo obtener soporte o reportar un error?
help-a3.innerHTML   = Por favor envía un email a <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = ¿Dónde se almacena mi transcripción? ¿Es segura?
help-a4             = Tu transcripción se almacena localmente en tu navegador web. Nunca sale de tu ordenador.
help-q5             = ¡Perdí mi transcripción!
help-a5a            = oTranscribe no es responsable de transcripciones perdidas. Sin embargo, oTranscribe ahora tiene múltiples métodos de copia de seguridad:
help-a5b.innerHTML   = <strong>Guardado automático:</strong> Tu transcripción se guarda en el almacenamiento local del navegador cada segundo.
help-a5c.innerHTML   = <strong>Descarga:</strong> Debes descargar periódicamente tu transcripción como archivo de texto plano, Markdown o RTF.
help-a5d            = Como último recurso, puedes recuperar tu transcripción usando el almacenamiento local del navegador:
help-a5e            = En Chrome, abre DevTools (F12), ve a la pestaña Application y comprueba el Almacenamiento Local para los datos de tu transcripción.
help-a5f            = En Firefox, abre DevTools (F12), ve a la pestaña Storage y busca en Almacenamiento Local.
help-a5g            = En Safari, habilita el menú Develop en Preferencias, luego ve a Develop > Show Web Inspector y comprueba el Almacenamiento Local.
help-a5h            = También puedes comprobar el panel Historial de transcripciones en oTranscribe (haz clic en el icono del reloj) para copias de seguridad automáticas.
help-q6             = ¿Por qué oTranscribe ya no guarda copias de seguridad? / ¿Por qué mi exportación no funciona?
help-a6a            = El almacenamiento de tu navegador puede estar lleno. Intenta borrar la caché y actualizar la página.
help-a6b            = También puedes usar el botón "Borrar caché" del panel de Configuración para liberar espacio de almacenamiento.
help-q7             = ¿Puedo personalizar los atajos de teclado?
help-a7             = Sí. Abre el panel de Configuración y busca la sección Atajos de teclado. Pulsa "Escuchar" junto a un atajo para grabar una nueva combinación de teclas. También puedes restablecer todos los atajos a sus valores predeterminados.
help-q8             = ¿Qué formatos de audio son compatibles?
help-a8             = La mayoría de los navegadores modernos admiten los formatos de audio MP3, WAV, OGG y AAC. Para vídeo son compatibles MP4 y WebM. También puedes cargar vídeos de YouTube y Vimeo mediante URL.
help-q9             = ¿Qué hacen las marcas de tiempo?
help-a9             = Las marcas de tiempo son enlaces interactivos que llevan al punto correspondiente del audio. Puedes insertarlas usando el botón situado sobre el editor de texto o el atajo de teclado (predeterminado: Alt+T). Haz clic en una marca de tiempo de tu transcripción para ir a ese punto del audio.
help-q10            = ¿Funciona oTranscribe sin conexión?
help-a10            = Sí, una vez cargada la aplicación funciona sin conexión. Sin embargo, necesitas cargar el archivo de audio desde tu ordenador (las URLs de YouTube/Vimeo requieren conexión a internet).
help-q11            = ¿Por qué mi vídeo de YouTube es tan lento?
help-a11            = Los vídeos de YouTube se transmiten a través de un proxy. Puedes cambiar la calidad del vídeo en los ajustes del reproductor para mejorar el rendimiento.
help-q12            = ¿Puedo importar o exportar transcripciones?
help-a12            = Sí. Puedes exportar tu transcripción como texto plano, Markdown o RTF usando el botón de exportación de la barra superior. También puedes importar archivos de texto.
help-q15             = ¿Cómo puedo escribir fonéticamente o usar un teclado virtual?
help-a15.innerHTML   = Puedes usar la extensión de Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Proporciona un teclado virtual y escritura fonética para muchos idiomas, permitiéndote escribir directamente en tu propio alfabeto en oTranscribe.

