help-back           = назад до oTranscribe
help-title          = Допомога oTranscribe
help-q1             = Чи пропонує oTranscribe автоматичне транскрибування?
help-a1             = Ні. oTranscribe — це інструмент, який спрощує ручне транскрибування. Він не транскрибує аудіо за вас.
help-q2             = Щось не працює! Як це виправити?
help-a2             = Спробуйте очистити кеш браузера та перезавантажити сторінку. Також переконайтеся, що ви використовуєте останню версію сучасного браузера, такого як Chrome, Firefox або Safari.
help-q3             = Як я можу отримати підтримку або повідомити про помилку?
help-a3.innerHTML    = Будь ласка, напишіть на <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Де зберігається моя розшифровка? Чи вона безпечна?
help-a4             = Ваша розшифровка зберігається локально у вашому браузері. Вона ніколи не покидає ваш комп'ютер.
help-q5             = Я втратив свою розшифровку!
help-a5a            = oTranscribe не несе відповідальності за втрачені розшифровки. Однак oTranscribe має декілька методів резервного копіювання:
help-a5b.innerHTML   = <strong>Автозбереження:</strong> Ваша розшифровка зберігається в локальному сховищі браузера щосекунди.
help-a5c.innerHTML   = <strong>Завантаження:</strong> Вам слід регулярно завантажувати розшифровку як звичайний текстовий файл, Markdown або RTF.
help-a5d            = В крайньому випадку ви можете відновити розшифровку з локального сховища браузера:
help-a5e            = У Chrome відкрийте DevTools (F12), перейдіть до вкладки Application і перевірте Local Storage на наявність даних розшифровки.
help-a5f            = У Firefox відкрийте DevTools (F12), перейдіть до вкладки Storage і перевірте Local Storage.
help-a5g            = У Safari увімкніть меню Develop в Налаштуваннях, потім перейдіть до Develop > Show Web Inspector і перевірте Local Storage.
help-a5h            = Також перевірте панель «Історія розшифровок» в oTranscribe (натисніть на іконку годинника) для перегляду автоматичних резервних копій.
help-q6             = Чому oTranscribe більше не зберігає резервні копії? / Чому мій експорт не працює?
help-a6a            = Пам'ять браузера може бути заповнена. Спробуйте очистити кеш браузера та оновити сторінку.
help-a6b            = Або ви можете скористатися кнопкою «Очистити кеш» в панелі Налаштування для звільнення місця.
help-q7             = Чи можна налаштувати гарячі клавіші?
help-a7             = Так. Відкрийте панель налаштувань і знайдіть розділ «Гарячі клавіші». Натисніть «Слухати» поруч із комбінацією, щоб записати нову комбінацію клавіш. Ви також можете відновити всі гарячі клавіші до стандартних.
help-q8             = Які аудіоформати підтримуються?
help-a8             = Більшість сучасних браузерів підтримують формати MP3, WAV, OGG та AAC. Для відео підтримуються MP4 та WebM. Ви також можете завантажувати відео з YouTube та Vimeo за посиланням.
help-q9             = Для чого потрібні часові мітки?
help-a9             = Часові мітки — це інтерактивні посилання, які переходять до відповідного моменту в аудіо. Ви можете вставити їх за допомогою кнопки над редактором або гарячою клавішею (за замовчуванням: Alt+T). Натисніть на часову мітку в розшифровці, щоб перейти до цього моменту в аудіо.
help-q10            = Чи працює oTranscribe офлайн?
help-a10            = Так, після завантаження програма працює офлайн. Однак потрібно завантажити аудіофайл з комп'ютера (URL YouTube/Vimeo потребують підключення до Інтернету).
help-q11            = Чому моє відео з YouTube повільне?
help-a11            = Відео з YouTube транслюються через проксі. Ви можете змінити якість відео в налаштуваннях програвача для покращення продуктивності.
help-q12            = Чи можна імпортувати або експортувати розшифровки?
help-a12            = Так. Ви можете експортувати розшифровку як звичайний текст, Markdown або RTF за допомогою кнопки експорту у верхній панелі. Також можна імпортувати текстові файли.
help-q15             = Як я можу друкувати фонетично або використовувати віртуальну клавіатуру?
help-a15.innerHTML   = Ви можете використовувати розширення Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Воно забезпечує віртуальну клавіатуру та фонетичний введення для багатьох мов, дозволяючи друкувати вашою мовою безпосередньо в oTranscribe.

