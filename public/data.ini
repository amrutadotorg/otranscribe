help-back           = zurück zu oTranscribe
help-title          = oTranscribe Hilfe
help-q1             = Bietet oTranscribe automatische Transkription an?
help-a1             = Nein. oTranscribe ist ein Werkzeug, das die manuelle Transkription erleichtert. Es transkribiert Audio nicht automatisch für Sie.
help-q2             = Etwas ist kaputt! Wie repariere ich es?
help-a2             = Versuchen Sie, den Browser-Cache zu leeren und die Seite neu zu laden. Stellen Sie auch sicher, dass Sie eine aktuelle Version eines modernen Browsers wie Chrome, Firefox oder Safari verwenden.
help-q3             = Wie kann ich Unterstützung erhalten oder einen Fehler melden?
help-a3.innerHTML    = Bitte senden Sie eine E-Mail an <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Wo wird mein Transkript gespeichert? Ist es sicher?
help-a4             = Ihr Transkript wird lokal in Ihrem Webbrowser gespeichert. Es verlässt nie Ihren Computer.
help-q5             = Ich habe mein Transkript verloren!
help-a5a            = oTranscribe ist nicht verantwortlich für verlorene Transkripte. Aber oTranscribe hat jetzt mehrere Sicherungsmethoden:
help-a5b.innerHTML   = <strong>Automatische Speicherung:</strong> Ihr Transkript wird jede Sekunde im lokalen Speicher Ihres Browsers gesichert.
help-a5c.innerHTML   = <strong>Download:</strong> Sie sollten Ihr Transkript regelmäßig als Klartext-, Markdown- oder RTF-Datei herunterladen.
help-a5d            = Als letzten Ausweg können Sie Ihr Transkript möglicherweise mit dem lokalen Speicher Ihres Browsers wiederherstellen:
help-a5e            = In Chrome öffnen Sie DevTools (F12), gehen Sie zum Tab Application und überprüfen Sie Local Storage auf Ihre Transkriptdaten.
help-a5f            = In Firefox öffnen Sie DevTools (F12), gehen Sie zum Tab Storage und schauen Sie unter Local Storage nach.
help-a5g            = In Safari aktivieren Sie das Develop-Menü in den Einstellungen, gehen Sie dann zu Develop > Show Web Inspector und überprüfen Sie Local Storage.
help-a5h            = Sie können auch das Transkriptverlaufspanel in oTranscribe überprüfen (klicken Sie auf das Uhrensymbol) für automatische Sicherungen.
help-q6             = Warum speichert oTranscribe keine Sicherungen mehr? / Warum funktioniert mein Export nicht?
help-a6a            = Der Speicher Ihres Browsers ist möglicherweise voll. Versuchen Sie, den Browser-Cache zu leeren und die Seite neu zu laden.
help-a6b            = Alternativ können Sie die Schaltfläche „Cache leeren" im Einstellungsbereich verwenden, um Speicherplatz freizugeben.
help-q7             = Kann ich die Tastenkombinationen anpassen?
help-a7             = Ja. Öffnen Sie den Einstellungsbereich und suchen Sie den Abschnitt Tastenkombinationen. Klicken Sie neben einer Tastenkombination auf „Lauschen", um eine neue Tastenkombination aufzunehmen. Sie können auch alle Tastenkombinationen auf die Standardwerte zurücksetzen.
help-q8             = Welche Audioformate werden unterstützt?
help-a8             = Die meisten modernen Browser unterstützen die Audioformate MP3, WAV, OGG und AAC. Für Videos werden MP4 und WebM unterstützt. Sie können auch YouTube- und Vimeo-Videos über eine URL laden.
help-q9             = Wofür dienen die Zeitstempel?
help-a9             = Zeitstempel sind interaktive Links, die zum entsprechenden Punkt im Audio springen. Sie können sie über die Schaltfläche über dem Texteditor oder mit der Tastenkombination (Standard: Alt+T) einfügen. Klicken Sie auf einen Zeitstempel in Ihrem Transkript, um zu dieser Stelle im Audio zu springen.
help-q10            = Funktioniert oTranscribe offline?
help-a10            = Ja, sobald die App geladen wurde, funktioniert sie offline. Sie müssen jedoch die Audiodatei von Ihrem Computer laden (YouTube/Vimeo-URLs erfordern eine Internetverbindung).
help-q11            = Warum ist mein YouTube-Video so langsam?
help-a11            = YouTube-Videos werden über einen Proxy gestreamt. Sie können die Videoqualität in den Player-Einstellungen ändern, um die Leistung zu verbessern.
help-q12            = Kann ich Transkripte importieren oder exportieren?
help-a12            = Ja. Sie können Ihr Transkript als Klartext, Markdown oder RTF über die Export-Schaltfläche in der oberen Leiste exportieren. Sie können auch Textdateien importieren.
help-q15             = Wie kann ich phonetisch tippen oder eine virtuelle Tastatur verwenden?
help-a15.innerHTML = Sie können die Chrome-Erweiterung <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a> verwenden. Sie bietet eine virtuelle Tastatur und phonetisches Tippen für viele Sprachen, sodass Sie direkt in oTranscribe in Ihrer Schrift tippen können.

