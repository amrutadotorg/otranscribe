help-back           = quay lại oTranscribe
help-title          = Trợ giúp oTranscribe
help-q1             = oTranscribe có cung cấp tự động phiên âm không?
help-a1             = Không. oTranscribe là một công cụ giúp việc phiên âm thủ công dễ dàng hơn. Nó không tự động phiên âm âm thanh cho bạn.
help-q2             = Có lỗi xảy ra! Làm thế nào để khắc phục?
help-a2             = Hãy thử xóa bộ nhớ cache trình duyệt và tải lại trang. Đảm bảo bạn đang sử dụng phiên bản mới nhất của trình duyệt hiện đại như Chrome, Firefox hoặc Safari.
help-q3             = Làm thế nào để tôi nhận hỗ trợ hoặc báo lỗi?
help-a3.innerHTML    = Vui lòng gửi email đến <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Bản chép lại của tôi được lưu ở đâu? Nó có an toàn không?
help-a4             = Bản chép lại của bạn được lưu cục bộ trong trình duyệt web. Nó không bao giờ rời khỏi máy tính.
help-q5             = Tôi đã mất bản chép lại!
help-a5a            = oTranscribe không chịu trách nhiệm về các bản chép lại bị mất. Tuy nhiên, oTranscribe hiện có nhiều phương thức sao lưu:
help-a5b.innerHTML   = <strong>Tự động lưu:</strong> Bản chép lại của bạn được lưu vào bộ nhớ cục bộ của trình duyệt mỗi giây.
help-a5c.innerHTML   = <strong>Tải xuống:</strong> Bạn nên định kỳ tải bản chép lại dưới dạng tệp văn bản thuần, Markdown hoặc RTF.
help-a5d            = Như biện pháp cuối cùng, bạn có thể khôi phục bản chép lại bằng bộ nhớ cục bộ của trình duyệt:
help-a5e            = Trong Chrome, mở DevTools (F12), chuyển đến tab Application và kiểm tra Local Storage để tìm dữ liệu bản ghi lại.
help-a5f            = Trong Firefox, mở DevTools (F12), chuyển đến tab Storage và xem dưới Local Storage.
help-a5g            = Trong Safari, bật menu Develop trong Tùy chọn, sau đó chuyển đến Develop > Show Web Inspector và kiểm tra Local Storage.
help-a5h            = Bạn cũng có thể kiểm tra bảng Lịch sử bản chép lại trong oTranscribe (nhấn vào biểu tượng đồng hồ) để xem bản sao lưu tự động.
help-q6             = Tại sao oTranscribe không còn lưu bản sao lưu? / Tại sao xuất của tôi không hoạt động?
help-a6a            = Bộ nhớ trình duyệt của bạn có thể đã đầy. Hãy thử xóa bộ nhớ cache và làm mới trang.
help-a6b            = Hoặc bạn có thể thử nút Xóa bộ nhớ cache trong bảng Cài đặt để giải phóng dung lượng.
help-q7             = Tôi có thể tùy chỉnh phím tắt không?
help-a7             = Có. Mở bảng Cài đặt và tìm phần Phím tắt. Nhấn "Lắng nghe" bên cạnh một phím tắt để ghi lại tổ hợp phím mới. Bạn cũng có thể đặt lại tất cả phím tắt về mặc định.
help-q8             = Các định dạng âm thanh nào được hỗ trợ?
help-a8             = Hầu hết các trình duyệt hiện đại hỗ trợ các định dạng âm thanh MP3, WAV, OGG và AAC. Đối với video, MP4 và WebM được hỗ trợ. Bạn cũng có thể tải video YouTube và Vimeo qua URL.
help-q9             = Dấu thời gian có tác dụng gì?
help-a9             = Dấu thời gian là các liên kết tương tác đưa bạn đến vị trí tương ứng trong âm thanh. Bạn có thể chèn chúng bằng nút phía trên trình soạn thảo văn bản hoặc phím tắt (mặc định: Alt+T). Nhấp vào dấu thời gian trong bản chép lại để chuyển đến vị trí đó trong âm thanh.
help-q10            = oTranscribe có hoạt động ngoại tuyến không?
help-a10            = Có, một khi ứng dụng được tải, nó hoạt động ngoại tuyến. Tuy nhiên, bạn cần tải tệp âm thanh từ máy tính của mình (URL YouTube/Vimeo yêu cầu kết nối internet).
help-q11            = Tại sao video YouTube của tôi lại chậm như vậy?
help-a11            = Video YouTube được phát qua proxy. Bạn có thể thay đổi chất lượng video trong cài đặt trình phát để cải thiện hiệu suất.
help-q12            = Tôi có thể nhập hoặc xuất bản chép lại không?
help-a12            = Có. Bạn có thể xuất bản chép lại dưới dạng văn bản thuần, Markdown hoặc RTF bằng nút xuất trên thanh trên cùng. Bạn cũng có thể nhập tệp văn bản.
help-q15             = Làm thế nào để tôi có thể gõ theo ngữ âm hoặc sử dụng bàn phím ảo?
help-a15.innerHTML   = Bạn có thể sử dụng tiện ích mở rộng Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Nó cung cấp bàn phím ảo và gõ ngữ âm cho nhiều ngôn ngữ, cho phép bạn gõ bằng chữ viết của mình trực tiếp trong oTranscribe.

