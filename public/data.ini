help-back           = voltar ao oTranscribe
help-title          = Ajuda do oTranscribe
help-q1             = O oTranscribe oferece transcrição automática?
help-a1             = Não. O oTranscribe é uma ferramenta para facilitar a transcrição manual. Não transcreve áudio por si.
help-q2             = Algo não está a funcionar! Como posso resolver?
help-a2             = Tente limpar a cache do seu navegador e recarregar a página. Certifique-se também de que está a utilizar uma versão atualizada de um navegador moderno como Chrome, Firefox ou Safari.
help-q3             = Como posso obter suporte ou reportar um bug?
help-a3.innerHTML    = Por favor envie um email para <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Onde é armazenada a minha transcrição? É segura?
help-a4             = A sua transcrição é armazenada localmente no seu navegador web. Nunca sai do seu computador.
help-q5             = Perdi a minha transcrição!
help-a5a            = O oTranscribe não é responsável por transcrições perdidas. No entanto, o oTranscribe agora tem vários métodos de cópia de segurança:
help-a5b.innerHTML   = <strong>Guardar automaticamente:</strong> A sua transcrição é guardada de segurança no armazenamento local do navegador a cada segundo.
help-a5c.innerHTML   = <strong>Download:</strong> Deve descarregar regularmente a sua transcrição como ficheiro de texto simples, Markdown ou RTF.
help-a5d            = Como último recurso, pode conseguir recuperar a sua transcrição utilizando o armazenamento local do navegador:
help-a5e            = No Chrome, abra o DevTools (F12), vá ao separador Application e verifique o Armazenamento Local para os dados da sua transcrição.
help-a5f            = No Firefox, abra o DevTools (F12), vá ao separador Storage e veja embaixo de Armazenamento Local.
help-a5g            = No Safari, ative o menu Develop nas Preferências, depois vá a Develop > Show Web Inspector e verifique o Armazenamento Local.
help-a5h            = Também pode verificar o painel Histórico de transcrições no oTranscribe (clique no ícone do relógio) para cópias de segurança automáticas.
help-q6             = Por que o oTranscribe já não guarda cópias de segurança? / Por que a minha exportação não funciona?
help-a6a            = O armazenamento do seu navegador pode estar cheio. Tente limpar a cache do navegador e atualizar a página.
help-a6b            = Em alternativa, pode tentar o botão Limpar cache no painel de Definições para libertar espaço de armazenamento.
help-q7             = Posso personalizar os atalhos de teclado?
help-a7             = Sim. Abra o painel Definições e encontre a secção Atalhos de teclado. Prima "Ouvir" junto a um atalho para gravar uma nova combinação de teclas. Também pode repor todos os atalhos para os valores predefinidos.
help-q8             = Que formatos de áudio são suportados?
help-a8             = A maioria dos navegadores modernos suporta os formatos de áudio MP3, WAV, OGG e AAC. Para vídeo, MP4 e WebM são suportados. Também pode carregar vídeos do YouTube e Vimeo por URL.
help-q9             = O que fazem as marcas temporais?
help-a9             = As marcas temporais são ligações interativas que saltam para o ponto correspondente no áudio. Pode inseri-las utilizando o botão acima do editor de texto ou premindo a tecla de atalho (predefinição: Alt+T). Clique numa marca temporal na sua transcrição para saltar para esse ponto no áudio.
help-q10            = O oTranscribe funciona offline?
help-a10            = Sim, uma vez que a app seja carregada funciona offline. No entanto, precisa de carregar o ficheiro de áudio do seu computador (os URLs do YouTube/Vimeo requerem ligação à internet).
help-q11            = Por que é que o meu vídeo do YouTube é tão lento?
help-a11            = Os vídeos do YouTube são transmitidos através de um proxy. Pode alterar a qualidade do vídeo nas definições do leitor para melhorar o desempenho.
help-q12            = Posso importar ou exportar transcrições?
help-a12            = Sim. Pode exportar a sua transcrição como texto simples, Markdown ou RTF usando o botão de exportação na barra superior. Também pode importar ficheiros de texto.
help-q15             = Como posso digitar foneticamente ou usar um teclado virtual?
help-a15.innerHTML   = Pode utilizar a extensão Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Fornece um teclado virtual e digitação fonética para muitos idiomas, permitindo-lhe digitar diretamente no seu próprio alfabeto no oTranscribe.

