help-back           = retour à oTranscribe
help-title          = Aide oTranscribe
help-q1             = oTranscribe propose-t-il une transcription automatique ?
help-a1             = Non. oTranscribe est un outil pour faciliter la transcription manuelle. Il ne transcrit pas l'audio pour vous.
help-q2             = Quelque chose est cassé ! Comment le réparer ?
help-a2             = Essayez de vider le cache de votre navigateur et de recharger la page. Assurez-vous également d'utiliser une version à jour d'un navigateur moderne comme Chrome, Firefox ou Safari.
help-q3             = Comment puis-je obtenir de l'aide ou signaler un bug ?
help-a3.innerHTML    = Veuillez envoyer un email à <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Où est stockée ma transcription ? Est-elle sécurisée ?
help-a4             = Votre transcription est stockée localement dans votre navigateur web. Elle ne quitte jamais votre ordinateur.
help-q5             = J'ai perdu ma transcription !
help-a5a            = oTranscribe n'est pas responsable des transcriptions perdues. Cependant, oTranscribe dispose désormais de plusieurs méthodes de sauvegarde :
help-a5b.innerHTML   = <strong>Sauvegarde automatique :</strong> Votre transcription est sauvegardée dans le stockage local de votre navigateur chaque seconde.
help-a5c.innerHTML   = <strong>Téléchargement :</strong> Vous devriez télécharger régulièrement votre transcription sous forme de fichier texte brut, Markdown ou RTF.
help-a5d            = En dernier recours, vous pourriez pouvoir récupérer votre transcription en utilisant le stockage local de votre navigateur :
help-a5e            = Dans Chrome, ouvrez DevTools (F12), allez dans l'onglet Application, et vérifiez le Stockage local pour vos données de transcription.
help-a5f            = Dans Firefox, ouvrez DevTools (F12), allez dans l'onglet Stockage, et regardez sous Stockage local.
help-a5g            = Dans Safari, activez le menu Develop dans les Préférences, puis allez dans Develop > Show Web Inspector et vérifiez le Stockage local.
help-a5h            = Vous pouvez également vérifier le panneau Historique de la transcription dans oTranscribe (cliquez sur l'icône d'horloge) pour les sauvegardes automatiques.
help-q6             = Pourquoi oTranscribe ne sauvegarde-t-il plus ? / Pourquoi mon export ne fonctionne-t-il pas ?
help-a6a            = Le stockage de votre navigateur est peut-être plein. Essayez de vider le cache de votre navigateur et de rafraîchir la page.
help-a6b            = Vous pouvez également utiliser le bouton « Effacer le cache » dans le panneau Paramètres pour libérer de l'espace de stockage.
help-q7             = Puis-je personnaliser les raccourcis clavier ?
help-a7             = Oui. Ouvrez le panneau Paramètres et trouvez la section Raccourcis clavier. Appuyez sur « Écouter » à côté d'un raccourci pour enregistrer une nouvelle combinaison de touches. Vous pouvez également réinitialiser tous les raccourcis à leurs valeurs par défaut.
help-q8             = Quels formats audio sont pris en charge ?
help-a8             = La plupart des navigateurs modernes prennent en charge les formats audio MP3, WAV, OGG et AAC. Pour la vidéo, les formats MP4 et WebM sont pris en charge. Vous pouvez également charger des vidéos YouTube et Vimeo par URL.
help-q9             = À quoi servent les horodatages ?
help-a9             = Les horodatages sont des liens interactifs qui permettent d'accéder directement au passage correspondant dans l'audio. Vous pouvez les insérer avec le bouton situé au-dessus de l'éditeur de texte ou avec le raccourci clavier (par défaut : Alt+T). Cliquez sur un horodatage dans votre transcription pour accéder à ce moment dans l'audio.
help-q10            = oTranscribe fonctionne-t-il hors ligne ?
help-a10            = Oui, une fois l'application chargée, elle fonctionne hors ligne. Cependant, vous devez charger le fichier audio depuis votre ordinateur (les URL YouTube/Vimeo nécessitent une connexion Internet).
help-q11            = Pourquoi ma vidéo YouTube est-elle si lente ?
help-a11            = Les vidéos YouTube sont diffusées via un proxy. Vous pouvez changer la qualité vidéo dans les paramètres du lecteur pour améliorer les performances.
help-q12            = Puis-je importer ou exporter des transcriptions ?
help-a12            = Oui. Vous pouvez exporter votre transcription en texte brut, Markdown ou RTF à l'aide du bouton d'exportation dans la barre supérieure. Vous pouvez également importer des fichiers texte.
help-q15             = Comment puis-je taper de manière phonétique ou utiliser un clavier virtuel ?
help-a15.innerHTML   = Vous pouvez utiliser l'extension Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Elle fournit un clavier virtuel et une saisie phonétique pour de nombreuses langues, vous permettant de taper dans votre script directement dans oTranscribe.

