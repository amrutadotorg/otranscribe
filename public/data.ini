; === Help page ===
help-back           = kembali ke oTranscribe
help-title          = Bantuan oTranscribe
help-q1             = Apakah oTranscribe menawarkan transkripsi otomatis?
help-a1             = Tidak. oTranscribe adalah alat untuk mempermudah transkripsi manual. Ini tidak melakukan transkripsi audio secara otomatis untuk Anda.
help-q2             = Sesuatu rusak! Bagaimana cara memperbaikinya?
help-a2             = Coba bersihkan cache browser Anda dan muat ulang halaman. Pastikan juga Anda menggunakan versi terbaru dari browser modern seperti Chrome, Firefox, atau Safari.
help-q3             = Bagaimana saya bisa mendapatkan bantuan atau melaporkan bug?
help-a3.innerHTML    = Kirim email ke <a href="mailto:help@amruta.org">help@amruta.org</a>.
help-q4             = Di mana transkrip saya disimpan? Apakah aman?
help-a4             = Transkrip Anda disimpan secara lokal di browser Anda. Tidak pernah meninggalkan komputer Anda.
help-q5             = Saya kehilangan transkrip saya!
help-a5a            = oTranscribe tidak bertanggung jawab atas transkrip yang hilang. Namun, oTranscribe sekarang memiliki beberapa metode cadangan:
help-a5b.innerHTML   = <strong>Penyimpanan otomatis:</strong> Transkrip Anda dicadangkan ke penyimpanan lokal browser setiap detik.
help-a5c.innerHTML   = <strong>Unduh:</strong> Anda harus secara berkala mengunduh transkrip sebagai file teks biasa, Markdown, atau RTF.
help-a5d            = Sebagai upaya terakhir, Anda mungkin dapat memulihkan transkrip menggunakan penyimpanan lokal browser:
help-a5e            = Di Chrome, buka DevTools (F12), buka tab Application, dan periksa Local Storage untuk data transkrip Anda.
help-a5f            = Di Firefox, buka DevTools (F12), buka tab Storage, dan lihat di bawah Local Storage.
help-a5g            = Di Safari, aktifkan menu Develop di Preferensi, lalu buka Develop > Show Web Inspector dan periksa Local Storage.
help-a5h            = Anda juga dapat memeriksa panel Riwayat transkrip di oTranscribe (klik ikon jam) untuk cadangan otomatis.
help-q6             = Mengapa oTranscribe tidak lagi menyimpan cadangan? / Mengapa ekspor saya tidak berfungsi?
help-a6a            = Penyimpanan browser Anda mungkin penuh. Coba bersihkan cache browser dan muat ulang halaman.
help-a6b            = Sebagai alternatif, Anda dapat menggunakan tombol „Hapus cache" di panel Pengaturan untuk membebaskan ruang penyimpanan.
help-q7             = Bisakah saya menyesuaikan pintasan keyboard?
help-a7             = Ya. Buka panel Pengaturan dan cari bagian Pintasan keyboard. Tekan „Rekam" di sebelah pintasan untuk merekam kombinasi tombol baru. Anda juga dapat mengatur ulang semua pintasan ke pengaturan default.
help-q8             = Format audio apa yang didukung?
help-a8             = Sebagian besar browser modern mendukung format audio MP3, WAV, OGG, dan AAC. Untuk video, MP4 dan WebM didukung. Anda juga dapat memuat video YouTube dan Vimeo melalui URL.
help-q9             = Apa yang dilakukan timestamp?
help-a9             = Stempel waktu adalah tautan interaktif yang menuju ke bagian audio yang sesuai. Anda dapat memasukkannya menggunakan tombol di atas editor teks atau pintasan keyboard (default: Alt+T). Klik stempel waktu dalam transkrip Anda untuk menuju ke bagian tersebut dalam audio.
help-q10            = Apakah oTranscribe berfungsi offline?
help-a10            = Ya, setelah aplikasi dimuat, aplikasi dapat bekerja offline. Namun, Anda harus memuat file audio dari komputer Anda (URL YouTube/Vimeo memerlukan koneksi internet).
help-q11            = Mengapa video YouTube saya sangat lambat?
help-a11            = Video YouTube dialirkan melalui proxy. Anda dapat mengubah kualitas video di pengaturan pemutar untuk meningkatkan performa.
help-q12            = Bisakah saya mengimpor atau mengekspor transkrip?
help-a12            = Ya. Anda dapat mengekspor transkrip sebagai teks biasa, Markdown, atau RTF menggunakan tombol ekspor di bilah atas. Anda juga dapat mengimpor file teks.
help-q15             = Bagaimana saya bisa mengetik secara fonetik atau menggunakan keyboard virtual?
help-a15.innerHTML   = Anda dapat menggunakan ekstensi Chrome <a href="https://chromewebstore.google.com/detail/mclkkofklkfljcocdinagocijmpgbhab?utm_source=item-share-cb" target="_blank">Google Input Tools</a>. Ini menyediakan keyboard virtual dan pengetikan fonetik untuk banyak bahasa, memungkinkan Anda mengetik dalam aksara Anda langsung di oTranscribe.

